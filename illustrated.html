.sweet:active{filter:drop-shadow(0 0 12px #fadc35) brightness(1.2)}.sweet.busy{filter:drop-shadow(0 0 8px #ffc700)}.sweet.taken{opacity:0;pointer-events:none}
@keyframes sweetFloat{to{transform:translateY(-4px)}}
.ant{position:absolute;z-index:5;transform:translate(-50%,-50%);width:11.5%;aspect-ratio:1;pointer-events:none;will-change:left,top;filter:drop-shadow(1px 5px 3px #3b291833)}
.ant img{width:100%;height:100%;object-fit:contain;animation:antBob .3s ease-in-out infinite alternate}
.ant.turn img{transform:scaleX(-1)}
.ant .cargo{position:absolute;width:37%;height:37%;right:0;top:-5%;display:none;filter:drop-shadow(0 2px 2px #654)}.ant.hasCargo .cargo{display:block}
@keyframes antBob{to{margin-top:-2px}}
.ripple{position:absolute;z-index:6;transform:translate(-50%,-50%);height:22px;width:22px;pointer-events:none;border:3px solid #ffb428;border-radius:50%;animation:ripple .65s ease-out forwards}
@keyframes ripple{to{opacity:0;height:75px;width:75px}}
.float{position:absolute;z-index:7;background:#fff5d3;color:#367f2b;border:2px solid #8eaa62;border-radius:99px;font-size:clamp(13px,2.2vw,19px);padding:4px 8px;font-weight:900;transform:translate(-50%,-50%);pointer-events:none;animation:pop .9s ease-out forwards}
@keyframes pop{to{opacity:0;transform:translate(-50%,-180%)}}
.progress-frame{background:#fff5da;border:4px solid #a87139;box-shadow:inset 0 2px 0 #fff9eb;border-radius:19px;margin:12px 2px 6px;padding:12px 10px;display:flex;align-items:center;gap:10px;font-weight:900;color:#6c4728;font-size:clamp(12px,3.1vw,19px)}
.progress-frame .bar{height:16px;background:#c7b697;border-radius:18px;overflow:hidden;flex:1;border:2px solid #bba37d;min-width:50px}.progress-frame .bar div{height:100%;width:0;background:linear-gradient(#8ee65f,#3d9d34);transition:width .3s;border-radius:18px}.progress-frame .counter{white-space:nowrap;font-variant-numeric:tabular-nums}
.help{padding:7px 12px;color:#fff1ce;font-weight:750;text-align:center;font-size:clamp(12px,3vw,18px);text-shadow:0 2px 3px #3e2918}
.store{border:4px solid #69401e;background:linear-gradient(180deg,#9a6338,#663b1d);padding:12px 8px;border-radius:22px;box-shadow:inset 0 2px 0 #d39655;margin-top:10px}
.store-title{width:fit-content;margin:-2px auto 12px;padding:6px 28px;background:linear-gradient(#587a35,#2a542a);border:3px solid #8db84b;border-radius:20px;color:#ffeec0;font-size:clamp(17px,4.2vw,27px);font-weight:900;text-shadow:0 3px 0 #21371b;box-shadow:0 5px 0 #38251c}
.upgrades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.up-card{background:linear-gradient(180deg,#fff9e9,#f3ddb2);border:3px solid #ca9c5b;border-radius:18px;padding:7px;box-shadow:inset 0 3px 0 #fffdf4,0 5px 0 #492a19;min-width:0;text-align:center}
.up-card .drawing{height:65px;display:grid;place-items:center}.up-card .drawing img{max-width:90%;max-height:62px;object-fit:contain}
.up-card .name{font-size:clamp(12px,2.6vw,17px);font-weight:950}.up-card .desc{font-size:clamp(9px,2vw,13px);color:#755c3f;min-height:27px}.up-card .level{font-size:clamp(10px,2vw,14px);color:#5c7839;font-weight:800}
.buy{background:linear-gradient(#7bc94f,#30882f);border:3px solid #316a2c;border-radius:12px;width:100%;color:white;font-weight:1000;font-size:clamp(16px,3.3vw,24px);padding:6px 4px;box-shadow:inset 0 2px 0 #a9ed8a,0 3px 0 #244d25;text-shadow:0 2px 2px #255218}.buy:disabled{opacity:.56;filter:saturate(.65)}
.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.area{background:#583c23;border:3px solid #bc9158;border-radius:15px;color:#fff6d5;padding:6px 3px 9px;font-weight:900;font-size:clamp(12px,3.1vw,19px);box-shadow:0 4px 0 #402513}.area .thumb{border-radius:8px;background:linear-gradient(#c5eac0,#e0c19d);font-size:clamp(26px,5vw,40px);padding:8px;margin-bottom:4px}.area:disabled{filter:grayscale(.9);opacity:.65}.area.selected{border-color:#ffe273;box-shadow:0 0 11px #ffe186,0 4px 0 #402513}
#toast{position:fixed;z-index:1000;bottom:35px;left:50%;transform:translate(-50%,20px);background:#2a5b30;color:#fff8db;font-weight:900;border:3px solid #a3ba68;border-radius:28px;padding:13px 20px;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 8px 17px #0005}#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:600px){.up-card .drawing{height:96px}.up-card .drawing img{max-height:90px}.up-card{padding:12px}.stat{min-height:110px}}
@media(max-width:390px){.stat{min-height:82px;border-radius:14px}.st-icon{display:none}.field-frame{border-width:5px}.up-card{border-width:2px}.store{padding:8px 5px}.up-card .drawing{height:53px}.up-card .drawing img{max-height:52px}}
</style></head><body>

const positions=[[58,46],[78,46],[67,67],[37,68],[85,76],[43,85]],types=['cupcake','cookie','pinkcandy','bluecandy','chocolate','lollipop'];
const areas=[{name:'المطبخ',icon:'🍳',goal:0},{name:'غرفة المعيشة',icon:'🛋️',goal:120},{name:'الحديقة',icon:'🌱',goal:450}];
let state={sugar:0,total:0,ants:3,trips:0,speed:0,bag:0,area:0,unlocked:0};
try{const old=JSON.parse(localStorage.getItem('ant-kingdom-art-v1')||'null');if(old)Object.assign(state,old)}catch(e){}
state.ants=Math.min(12,Math.max(3,Number(state.ants)||3));state.unlocked=Math.min(2,Math.max(0,Number(state.unlocked)||0));state.area=Math.min(state.area,state.unlocked);
const antList=[],candyList=[];let last=0,saveCounter=0,timer;
function save(){try{localStorage.setItem('ant-kingdom-art-v1',JSON.stringify(state))}catch(e){}}
function toast(str){$('toast').textContent=str;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
function format(n){return Math.floor(n).toLocaleString('en-US')}
function createAnt(){const node=document.createElement('div');node.className='ant';node.innerHTML='<img src="'+asset('ant')+'" alt=""><img class="cargo" src="'+asset('pinkcandy')+'" alt="">';field.appendChild(node);return{x:18+Math.random()*3,y:67+Math.random()*7,phase:'idle',target:null,node}}
function ensureAnts(){while(antList.length<state.ants)antList.push(createAnt());while(antList.length>state.ants)antList.pop().node.remove()}
function makeCandy(i){const node=document.createElement('button');node.type='button';node.className='sweet';node.setAttribute('aria-label','جمع قطعة '+(i+1));node.style.left=positions[i][0]+'%';node.style.top=positions[i][1]+'%';node.innerHTML='<img src="'+asset(types[i])+'" alt="">';field.appendChild(node);const c={x:positions[i][0],y:positions[i][1],kind:types[i],node,stock:true,busy:false,respawn:0,base:[12,8,9,11,14,16][i]};node.addEventListener('click',()=>send(c));return c}
function pop(txt,x,y){const n=document.createElement('div');n.className='float';n.textContent=txt;n.style.left=x+'%';n.style.top=y+'%';field.appendChild(n);setTimeout(()=>n.remove(),950)}
function send(c){if(!c.stock||c.busy)return;const a=antList.find(v=>v.phase==='idle');if(!a){toast('🐜 النمل مشغول، انتظر رجوعه');return}c.busy=true;a.target=c;a.phase='to';c.node.classList.add('busy');const circle=document.createElement('div');circle.className='ripple';circle.style.left=c.x+'%';circle.style.top=c.y+'%';field.appendChild(circle);setTimeout(()=>circle.remove(),700);$('help').textContent='🐜 نملة رايحة للحلوى اللي اخترتها…'}
function price(id){const p={worker:50,speed:75,bag:100}[id];const n=id==='worker'?state.ants-3:state[id];return Math.round(p*Math.pow(1.59,n))}
function drawUI(){ $('sugar').textContent=format(state.sugar);$('ants').textContent=String(antList.length);$('trips').textContent=format(state.trips);const next=areas[state.unlocked+1];$('progressLabel').textContent=next?format(state.total)+' / '+format(next.goal):'مكتملة 🏆';$('progress').style.width=next?Math.min(100,100*state.total/next.goal)+'%':'100%';
 const upgrades=[['worker','نملة جديدة','زيادة عدد النمل','ant'],['speed','سرعة السير','النمل يتحرك أسرع','ant'],['bag','سعة الحمولة','سكر أكثر لكل رحلة','chocolate']];
 $('upgrades').innerHTML=upgrades.map(([id,name,desc,icon])=>'<div class="up-card"><div class="drawing"><img src="'+asset(icon)+'"></div><div class="name">'+name+'</div><div class="desc">'+desc+'</div><div class="level">'+(id==='worker'?'النمل '+state.ants:'المستوى '+(state[id]+1))+'</div><button class="buy" data-up="'+id+'" '+(state.sugar<price(id)||(id==='worker'&&state.ants>=12)?'disabled':'')+'>🍬 '+format(price(id))+'</button></div>').join('');
 $('areas').innerHTML=areas.map((a,i)=>'<button class="area '+(i===state.area?'selected':'')+'" data-area="'+i+'" '+(i>state.unlocked?'disabled':'')+'><div class="thumb">'+(i>state.unlocked?'🔒':a.icon)+'</div>'+a.name+'</button>').join('');}
$('upgrades').addEventListener('click',e=>{const b=e.target.closest('[data-up]');if(!b)return;const id=b.dataset.up,p=price(id);if(state.sugar<p)return;state.sugar-=p;if(id==='worker'){state.ants++;ensureAnts()}else state[id]++;toast('✅ تم التطوير');drawUI();save()});
$('areas').addEventListener('click',e=>{const b=e.target.closest('[data-area]');if(!b)return;const a=+b.dataset.area;if(a>state.unlocked||a===state.area)return;state.area=a;candyList.forEach(c=>{c.stock=true;c.busy=false;c.respawn=0;c.node.classList.remove('busy','taken')});antList.forEach(a=>{a.phase='idle';a.target=null;a.x=18+Math.random()*3;a.y=67+Math.random()*7;a.node.classList.remove('turn','hasCargo')});field.style.filter=a===0?'none':a===1?'sepia(.10) hue-rotate(6deg)':'hue-rotate(25deg) saturate(1.15)';toast('فتحت '+areas[a].name+' • الخلفية التجريبية');drawUI();save()});
$('reset').addEventListener('click',()=>{if(!confirm('هل تريد بدء مستعمرة جديدة؟'))return;localStorage.removeItem('ant-kingdom-art-v1');location.reload()});
function step(a,tx,ty,dt){const dx=tx-a.x,dy=ty-a.y,dist=Math.hypot(dx,dy),len=(17+state.speed*6)*dt;if(dist<=len){a.x=tx;a.y=ty;return true}a.x+=dx/dist*len;a.y+=dy/dist*len;return false}
function frame(t){const dt=last?Math.min(.06,(t-last)/1000):0;last=t;saveCounter+=dt;
 for(const c of candyList)if(c.respawn>0){c.respawn-=dt;if(c.respawn<=0){c.stock=true;c.busy=false;c.node.classList.remove('busy','taken')}}
 for(const a of antList){if(a.phase==='to'&&a.target){a.node.classList.remove('turn');if(step(a,a.target.x,a.target.y,dt)){a.phase='back';a.node.classList.add('hasCargo','turn');a.target.stock=false;a.target.node.classList.add('taken');}}
 else if(a.phase==='back'&&a.target){if(step(a,15,67,dt)){const c=a.target;const amount=Math.round(c.base*(1+state.bag*.4)*(1+state.area*.6));state.sugar+=amount;state.total+=amount;state.trips++;c.respawn=2.8;c.busy=false;a.target=null;a.phase='idle';a.node.classList.remove('hasCargo','turn');pop('+'+amount+' 🍬',18,65);while(state.unlocked<2&&state.total>=areas[state.unlocked+1].goal){state.unlocked++;toast('🎉 منطقة جديدة انفتحت!')}drawUI();save();$('help').textContent='✅ وصلت الحلوى للعش وزاد السكر، اضغط حلوى ثانية';}}
 a.node.style.left=a.x+'%';a.node.style.top=a.y+'%';}
 if(saveCounter>6){saveCounter=0;save()}requestAnimationFrame(frame)}
ensureAnts();for(let i=0;i<types.length;i++)candyList.push(makeCandy(i));drawUI();requestAnimationFrame(frame);
window.AntGame={state:()=>({...state,visibleAnts:antList.length}),tap:i=>send(candyList[i]),grant:n=>{state.sugar+=n;state.total+=n;drawUI()}};
})();
</script></body></html>
