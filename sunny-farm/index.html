<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{padding:0;margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:linear-gradient(140deg,#7aba56,#466f43);font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;color:#654024}button{font:inherit;cursor:pointer;border:0}#screen{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none}#stage{position:absolute;top:0;left:0;width:941px;height:1672px;transform-origin:top left;will-change:transform;touch-action:none;cursor:grab}#stage.dragging{cursor:grabbing}#sceneImage{display:block;width:100%;height:100%;pointer-events:none}#hitZones{position:absolute;inset:0}#hitZones button{position:absolute;color:transparent;background:transparent;outline:none;touch-action:none;border:0}#hitZones button:focus-visible{outline:6px solid #ffdd65;border-radius:20px}#statusLayer{position:absolute;inset:0;pointer-events:none}#statusLayer .status{position:absolute;display:flex;align-items:center;gap:7px;transform:translate(-50%,-50%);font-size:21px;color:#fff8d9;background:linear-gradient(180deg,#62432ae8,#3b2819eb);padding:7px 14px;border-radius:25px;border:3px solid #ffe8a0;box-shadow:0 5px 0 #3f271f80,0 12px 15px #39271a55;direction:rtl;white-space:nowrap;animation:float 2.6s ease-in-out infinite;pointer-events:auto}#statusLayer .status.ready{background:linear-gradient(#89bf4b,#317a3c);border-color:#fff5a0}#statusLayer .status.locked{background:#493c32d9;filter:grayscale(.6)}@keyframes float{0%,100%{translate:0 0}50%{translate:0 -6px}}
#liveStats{position:absolute;z-index:5;top:env(safe-area-inset-top);left:0;right:0;pointer-events:none}#levelCover,#coinCover,#gemCover{position:absolute;background:linear-gradient(170deg,#30291f,#201f18);border-radius:13px;padding:2px 7px;color:#fffbec;text-shadow:0 2px 2px #190f08;font-size:15px;font-weight:1000;text-align:center;direction:ltr;box-shadow:0 0 0 2px #ffcf71aa;transform:translate(-50%,-50%)}#levelCover{background:linear-gradient(170deg,#ffdf55,#e69e0c);border-radius:50%;color:#fff9e7;text-shadow:1px 2px #9c5a17;font-size:25px}#coinCover,#gemCover{min-width:74px}
#fabControls{position:fixed;z-index:6;right:11px;bottom:calc(112px + env(safe-area-inset-bottom));display:flex;gap:7px;flex-direction:column}#fabControls button{width:44px;height:44px;border-radius:14px;background:linear-gradient(#fff1c7,#dca561);border:3px solid #fce4b3;box-shadow:0 4px 0 #774727,0 7px 15px #3b2a2069;font-size:22px;color:#704a2e;font-weight:1000}
#notification{position:fixed;left:50%;top:calc(92px + env(safe-area-inset-top));transform:translate(-50%,-15px);opacity:0;pointer-events:none;z-index:20;transition:opacity .22s,transform .22s;background:linear-gradient(#543a28,#3a2417);border:2px solid #ffdf9c;box-shadow:0 8px 24px #261c1888;padding:12px 17px;min-width:180px;max-width:min(90vw,390px);text-align:center;border-radius:19px;color:white;font-weight:900;font-size:14px}#notification.show{opacity:1;transform:translate(-50%,0)}
#dim{position:fixed;inset:0;background:#10190986;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;z-index:30}#dim.open{display:block}#panel{direction:rtl;position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,550px);max-height:min(77dvh,760px);overflow:auto;background:linear-gradient(180deg,#fff9e5,#f6dfae);border:4px solid #fff4d1;border-bottom:none;border-radius:29px 29px 0 0;box-shadow:0 -8px 45px #1b201267;padding:18px 16px calc(25px + env(safe-area-inset-bottom));touch-action:pan-y;color:#60391e}#panel h2{font-size:23px;margin:0;color:#6a3e20}#panel p{line-height:1.5}#panel .desc{font-size:13px;font-weight:700;color:#a0784a;margin:6px 0 16px}#panel .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;border-bottom:2px solid #e9c88d;padding-bottom:12px;margin-bottom:13px}#close{font-size:25px;line-height:1;background:#edd0a0;border:2px solid #c89c66;border-radius:15px;padding:3px 11px;color:#78502d}#panel .list{display:flex;gap:10px;flex-direction:column}#panel .entry{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px;border:2px solid #e9c696;border-radius:16px;background:#fff9e9;box-shadow:0 3px 0 #e0b47d4d}#panel .entry .ico{font-size:37px;min-width:45px;text-align:center}#panel .entry .data{flex:1;min-width:0}#panel .entry strong{display:block;font-size:15px}#panel .entry small{display:block;color:#966e43;line-height:1.4;font-weight:750}#panel button.action{color:#fffbea;background:linear-gradient(#82c84a,#3a8b37);box-shadow:0 4px 0 #286633;padding:11px 15px;border-radius:13px;white-space:nowrap;font-weight:900;border:2px solid #bce780;font-size:13px}#panel button.action.orange{background:linear-gradient(#f9c15e,#dd8235);box-shadow:0 4px 0 #a85b29;border-color:#ffe9ac}#panel button.action:disabled{filter:grayscale(.7);opacity:.56;box-shadow:none;cursor:not-allowed}#panel button.full{width:100%;padding:14px;font-size:16px;margin:8px 0}#panel .iconBig{font-size:65px;text-align:center;margin:10px}#panel .progress{height:16px;background:#dfc89f;border:2px solid #c9a471;border-radius:999px;overflow:hidden;margin:14px 0}#panel .progress>span{height:100%;display:block;background:linear-gradient(90deg,#6ab63e,#f3c847);border-radius:999px;transition:width .4s}#panel .notice{padding:12px;border-radius:13px;background:#faecd0;border:1px solid #e8cca2;font-weight:750;font-size:14px;text-align:center;margin:13px 0}#panel .pill{display:inline-block;border-radius:11px;background:#f9e9c9;color:#996f43;padding:4px 8px;font-weight:900;font-size:11px;margin:3px}#panel .empty{text-align:center;padding:35px;color:#96724a}#panel .items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}#panel .item{background:#fff9ea;border:2px solid #dfbf88;border-radius:18px;text-align:center;padding:15px 9px}#panel .item .art{font-size:48px}#panel .item strong{display:block;margin:3px 0}#panel .item small{display:block;color:#9a774d;font-weight:900;margin:4px}#panel .item button{margin-top:9px}#panel h3{margin:20px 0 10px;color:#704322;font-size:16px}#panel .wide{display:flex;justify-content:space-around;gap:9px;flex-wrap:wrap}#tip{position:fixed;bottom:calc(105px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#312318e5;color:#fff9e6;padding:10px 15px;border:2px solid #f9d89b;border-radius:20px;z-index:7;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 6px 18px #1e1e1a77;animation:fadeOut 5s both;pointer-events:none}@keyframes fadeOut{0%,75%{opacity:1}100%{opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:19;overflow:hidden}.pop{position:absolute;font-size:23px;font-weight:1000;color:#fff4a6;text-shadow:0 3px 2px #6f432e,-1px 0 #6f432e,2px 0 #6f432e;animation:popUp 1.15s ease-out forwards;white-space:nowrap}@keyframes popUp{0%{transform:translateY(20px) scale(.7);opacity:0}15%{opacity:1}100%{transform:translateY(-65px) scale(1.2);opacity:0}}
#aboutLine{position:fixed;left:9px;bottom:7px;z-index:5;color:#fff5d0aa;font-size:9px;pointer-events:none;opacity:.5}button:focus-visible{outline:3px solid #ffcc44}
@media(min-width:680px){#panel{max-height:70vh}}@media(prefers-reduced-motion:reduce){.status{animation:none!important}*{scroll-behavior:auto!important}}
</style>

<style id="sunny-interactive">
#screen:before{content:"";position:absolute;inset:-26px;background-image:var(--farm-bg);background-position:center;background-size:cover;filter:blur(21px) saturate(.75) brightness(.78);opacity:.98;pointer-events:none}

#ambient{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pondRipple{position:absolute;left:605px;top:1292px;width:180px;height:34px;border:2px solid #c8fdff7f;border-radius:50%;box-shadow:0 0 16px #85e8f499;animation:ripple 4.2s linear infinite;transform:rotate(-16deg)}
@keyframes ripple{0%{opacity:0;scale:.5}35%{opacity:.68}100%{opacity:0;scale:1.65}}
.smoke{position:absolute;left:562px;top:174px;width:23px;height:23px;border-radius:50%;background:#f5f4e2a8;filter:blur(6px);animation:smoking 4.5s ease-out infinite}
.smoke2{animation-delay:-2.2s}
@keyframes smoking{from{opacity:0;translate:0 4px;scale:.6}35%{opacity:.48}to{opacity:0;translate:24px -130px;scale:2.5}}
.firefly{position:absolute;font-size:21px;color:#fffaafbb;text-shadow:0 0 18px #fff190;animation:glimmer 3s ease-in-out infinite;left:500px;top:900px}
.firefly.two{left:202px;top:1090px;animation-delay:1.4s}
@keyframes glimmer{0%,100%{opacity:0;translate:0 0}50%{opacity:.95;translate:12px -15px}}
.boughtFlower{position:absolute;font-size:49px;filter:drop-shadow(0 5px 3px #28291e85);animation:flowerBob 3.5s ease-in-out infinite}
@keyframes flowerBob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg) translateY(-3px)}}
#hitZones button:active{background:#ffeba322;color:transparent;border-radius:30px;box-shadow:inset 0 0 20px #ffe68d96}
#sceneImage{user-select:none;image-rendering:auto}
#statusLayer .status{font-size:20px;box-shadow:0 4px 0 #3f271f80,0 12px 15px #39271a55}
</style>

function xp(q){s.xp+=q;while(s.xp>=goal(s.level)){s.xp-=goal(s.level);s.level++;s.coins+=80+s.level*20;toast('🏆 مبروك! وصلت إلى المستوى '+s.level)}refresh();save()}

function seedSelect(i){const plot=art.plots[i];if(!plot)return;let html='<div class="notice">اختر بذور الحقل، شاهدها تنمو ثم احصدها لتحصل على المنتجات والخبرة 🌻</div><div class="items">';for(const [k,c]of Object.entries(CROPS)){let locked=s.level<c.level;html+=`<div class="item"><div class="art">${c.icon}</div><strong>${c.name}</strong><small>${Math.ceil(c.time/1000)} ثانية · +${c.qty}</small><button class="action" data-seed="${k}" ${locked||s.coins<c.cost?'disabled':''}>${locked?'🔒 مستوى '+c.level:'🪙 '+c.cost+' · ازرع'}</button></div>`;}html+='</div>';open('🌾 ازرع محصولًا','الحقل رقم '+(i+1),html);document.querySelectorAll('[data-seed]').forEach(b=>b.onclick=()=>{const c=CROPS[b.dataset.seed];if(s.level<c.level||s.coins<c.cost)return;s.coins-=c.cost;plot.crop=b.dataset.seed;plot.at=Date.now();save();refresh();close();floating(i?300:330,i?935:630,'🌱 زراعة!');toast('🌱 زرعت '+c.name+'. ارجع للحقل عند انتهاء النمو')})}
function field(i){const plot=art.plots[i];if(!plot.crop)return seedSelect(i);const c=CROPS[plot.crop],remaining=Math.max(0,plot.at+c.time-Date.now()),ready=remaining===0;let body=`<div class="iconBig">${c.icon}</div><div class="notice">${ready?'✨ الحصاد جاهز الآن!':'🌱 ينمو محصولك... باقي '+Math.ceil(remaining/1000)+' ثانية'}</div>${meter(100-remaining/c.time*100)}<button class="action full" id="doField">${ready?'🌾 احصد '+c.qty+' '+c.name:'💎 سرّع النمو (جوهرة واحدة)'}</button>`;open(c.icon+' '+c.name,'حقل المحاصيل رقم '+(i+1),body);$('doField').onclick=()=>{if(ready){add(plot.crop,c.qty);art.stats.harvest++;plot.crop=null;plot.at=0;xp(c.xp);floating(i?310:330,i?945:630,'+'+c.qty+' '+c.icon);toast('🌾 حصاد رائع! +'+c.qty+' '+c.name);save();close()}else if(s.gems>0){s.gems--;plot.at=Date.now()-c.time;save();refresh();field(i)}else toast('💎 لا توجد جواهر كافية')}}
function animal(k){const c=ANIMALS[k],a=art.animals[k];if(s.level<c.lvl){open('🔒 '+c.name,'حيّ الحيوانات',`<div class="iconBig">${c.icon}</div><div class="notice">تفتح هذه الحظيرة عند المستوى ${c.lvl}. احصد ولبّ طلباتك لرفع المستوى!</div>`);return}let remaining=Math.max(0,(a.end||0)-Date.now());const ready=!!(a.ready||(a.end&&remaining===0)),busy=remaining>0&&!ready;let body=`<div class="iconBig">${c.icon}</div><div class="notice">${ready?'✨ '+GOODS[c.item].name+' جاهز للجمع':busy?'⏳ وقت الإنتاج: '+Math.ceil(remaining/1000)+' ثانية':'🌿 حيواناتك تنتظر الطعام'}</div>`;if(busy)body+=meter(100-remaining/c.time*100);else if(ready)body+=`<button class="action full" id="doAnimal">${GOODS[c.item].icon} اجمع ${c.qty} ${GOODS[c.item].name}</button>`;else body+=`<div class="notice">الطعام المطلوب: ${needText(c.needs)}</div><button class="action full" id="doAnimal" ${Object.entries(c.needs).some(([x,n])=>avail(x)<n)?'disabled':''}>🌿 أطعم الحيوانات</button>`;open(c.icon+' '+c.name,'تغذية وإنتاج وجمع',body);const button=$('doAnimal');if(button)button.onclick=()=>{if(ready){add(c.item,c.qty);a.ready=false;a.end=0;art.stats[k==='chicken'?'egg':k==='sheep'?'wool':'milk']=(art.stats[k==='chicken'?'egg':k==='sheep'?'wool':'milk']||0)+c.qty;xp(c.xp);floating(c.x,c.y,'+'+c.qty+' '+GOODS[c.item].icon);toast('🎉 جمعت '+GOODS[c.item].name)}else if(spend(c.needs)){a.ready=false;a.end=Date.now()+c.time;toast('💚 بدأت دورة إنتاج '+GOODS[c.item].name)}save();refresh();animal(k)}}
function animals(){let body='<div class="list">';for(let [k,c]of Object.entries(ANIMALS)){const a=art.animals[k];let locked=s.level<c.lvl,ready=a.ready||(a.end&&a.end<=Date.now());let label=locked?'🔒 المستوى '+c.lvl:ready?'✨ الإنتاج جاهز':a.end?'⏳ الإنتاج جاري':'🌿 تحتاج طعام';body+=`<div class="entry"><span class="ico">${c.icon}</span><div class="data"><strong>${c.name}</strong><small>${label} · ${GOODS[c.item].icon} × ${c.qty}</small></div><button class="action" data-animal="${k}">زيارة</button></div>`}body+='</div>';open('🐮 الحيوانات','الدجاج والأبقار والأغنام',body);document.querySelectorAll('[data-animal]').forEach(b=>b.onclick=()=>animal(b.dataset.animal))}

let vScale=1,base=1,offsetX=0,offsetY=0,extraScale=1,dragging=false,down=null;
function fit(){let vw=window.innerWidth,vh=window.innerHeight;base=Math.min(vw/WIDTH,vh/HEIGHT);const w=WIDTH*base*extraScale,h=HEIGHT*base*extraScale;if(!fit.once){offsetX=(vw-w)/2;offsetY=(vh-h)/2;fit.once=true}offsetX=w<=vw?(vw-w)/2:Math.max(vw-w,Math.min(0,offsetX));offsetY=h<=vh?(vh-h)/2:Math.max(vh-h,Math.min(0,offsetY));paintTransform()}
function paintTransform(){vScale=base*extraScale;$('stage').style.transform=`translate(${offsetX}px,${offsetY}px) scale(${vScale})`;const o=(p,x,y)=>{p.style.left=(offsetX+x*vScale)+'px';p.style.top=(offsetY+y*vScale)+'px'};o($('coinCover'),505,54);o($('gemCover'),755,54);o($('levelCover'),65,130)}
function worldToScreen(x,y){return [offsetX+x*vScale,offsetY+y*vScale]}
function resetCamera(){extraScale=1;const vw=window.innerWidth,vh=window.innerHeight;offsetX=(vw-WIDTH*base)/2;offsetY=(vh-HEIGHT*base)/2;fit()}
function jumpTo(x,y,z){extraScale=Math.max(1,Math.min(2.2,z));offsetX=window.innerWidth/2-x*base*extraScale;offsetY=window.innerHeight/2-y*base*extraScale;fit()}
function zoom(delta){let [sx,sy]=[window.innerWidth*.5,window.innerHeight*.5], wx=(sx-offsetX)/vScale, wy=(sy-offsetY)/vScale;extraScale=Math.max(1,Math.min(2.6,extraScale+delta));let newScale=base*extraScale;offsetX=sx-wx*newScale;offsetY=sy-wy*newScale;fit()}
$('zoomPlus').onclick=()=>zoom(.2);$('zoomMinus').onclick=()=>zoom(-.2);$('centerBtn').onclick=resetCamera;
function drawPills(){let el=$('statusLayer');el.innerHTML='';const statuses=[{x:438,y:568,plot:art.plots[0],i:0},{x:400,y:800,plot:art.plots[1],i:1},{x:730,y:625,animal:'cow'},{x:617,y:746,animal:'chicken'},{x:772,y:939,animal:'sheep'},{x:460,y:1148,well:true}];for(const z of statuses){let msg='',ready=false,locked=false;if(z.well){msg=Date.now()>=(art.waterAt||0)?'💧 اجمع الماء':'⏳ '+Math.ceil(((art.waterAt||0)-Date.now())/1000)+'ث';ready=Date.now()>=(art.waterAt||0)}else if(z.plot){let c=CROPS[z.plot.crop];if(c){ready=Date.now()>=z.plot.at+c.time;msg=ready?'🌾 جاهز':'🌱 '+Math.ceil(Math.max(0,z.plot.at+c.time-Date.now())/1000)+'ث'}}else{let a=art.animals[z.animal],c=ANIMALS[z.animal];locked=s.level<c.lvl;if(locked)msg='🔒 '+c.lvl;else if(a.ready||(a.end&&a.end<=Date.now())){ready=true;msg=GOODS[c.item].icon+' جاهز'}else if(a.end)msg='⏳ '+Math.ceil(Math.max(0,a.end-Date.now())/1000)+'ث'}if(!msg)continue;let d=document.createElement('div');d.className='status'+(ready?' ready':'')+(locked?' locked':'');d.textContent=msg;d.style.left=z.x+'px';d.style.top=z.y+'px';d.onclick=()=>{if(z.well)well();else if(z.plot)field(z.i);else animal(z.animal)};el.appendChild(d)}}
function renderZones(){const c=$('hitZones');c.innerHTML='';for(const z of zones){let b=document.createElement('button');b.type='button';b.setAttribute('aria-label',z.type);b.style.left=z.x+'px';b.style.top=z.y+'px';b.style.width=z.w+'px';b.style.height=z.h+'px';b.dataset.z=z.type;b.onclick=()=>{if(!dragging)action(z.type)};c.appendChild(b)}}
const activePointers=new Map();let lastPinch=0;
$('stage').addEventListener('pointerdown',e=>{if($('dim').classList.contains('open'))return;activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(activePointers.size===1){down={x:e.clientX,y:e.clientY};dragging=false;$('stage').classList.add('dragging')}else{down=null;lastPinch=0}});
$('stage').addEventListener('pointermove',e=>{if(!activePointers.has(e.pointerId))return;let p=activePointers.get(e.pointerId);activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(activePointers.size===1){let dx=e.clientX-p.x,dy=e.clientY-p.y;if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>12)dragging=true;if(dragging){offsetX+=dx;offsetY+=dy;fit()}}else if(activePointers.size===2){let [a,b]=Array.from(activePointers.values()),dist=Math.hypot(a.x-b.x,a.y-b.y);if(lastPinch)zoom((dist-lastPinch)/500);lastPinch=dist;dragging=true}});
function endPointer(e){activePointers.delete(e.pointerId);if(!activePointers.size){setTimeout(()=>{dragging=false},20);$('stage').classList.remove('dragging');down=null}lastPinch=0}
$('stage').addEventListener('pointerup',endPointer);$('stage').addEventListener('pointercancel',endPointer);
window.addEventListener('resize',fit);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.sunnyFarm={get state(){return s},get art(){return art},openPlants:plants,openAnimals:animals,openOrders:orders,openFactories:factories,plant:(i,k)=>{let p=art.plots[i],c=CROPS[k];if(!p||p.crop||!c||s.coins<c.cost)return false;s.coins-=c.cost;p.crop=k;p.at=Date.now();save();refresh();return true},harvest:i=>{let p=art.plots[i];if(!p||!p.crop)return false;let c=CROPS[p.crop];if(Date.now()<p.at+c.time)return false;add(p.crop,c.qty);p.crop=null;p.at=0;xp(c.xp);save();return true},giveItem:(k,q)=>{if(GOODS[k]){add(k,q);save();refresh()}},zoom,resetCamera};
document.documentElement.style.setProperty('--farm-bg','url("'+$('sceneImage').src+'")');renderZones();fit();refresh();drawDecor();setInterval(()=>{drawPills()},1200);save();
})();
</script>
