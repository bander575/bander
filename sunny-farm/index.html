const questDefs=[{key:'harvest',name:'موسم حصاد سعيد',desc:'احصد ٨ مرات من حقولك',icon:'🌾',target:8,reward:115,xp:22},{key:'eggs',name:'فطور أهل القرية',desc:'اجمع ٤ بيضات من الدجاج',icon:'🥚',target:4,reward:135,xp:24},{key:'wool',name:'صوف الأغنام',desc:'اجمع ٤ قطع صوف من أغنامك',icon:'🧶',target:4,reward:190,xp:32},{key:'orders',name:'تاجر القرية',desc:'سلّم طلبين للشاحنة',icon:'🚚',target:2,reward:170,xp:30}];
const rnd=(a,b)=>{let n=Math.sin(a*127.1+b*311.7)*43758.5453;return n-Math.floor(n);};

function lvlGoal(l){return 26+l*23;}function inv(item){return s.inventory[item]||0;}function add(item,n){s.inventory[item]=Math.max(0,inv(item)+n);}function money(n){s.coins=Math.max(0,s.coins+n);updateHUD();}
function grantXP(n){s.xp+=n;let gained=0;while(s.xp>=lvlGoal(s.level)){s.xp-=lvlGoal(s.level);s.level++;s.coins+=70+s.level*20;gained++;}if(gained){toast('🎉 وصلت للمستوى '+s.level+'! فتحنا لك أشياء جديدة');bursts(sw*.5,sh*.33,'#ffd350',35);}updateHUD();save();}
function updateHUD(){$('coinText').textContent=s.coins.toLocaleString('ar-SA');$('gemText').textContent=s.gems;$('levelText').textContent='المستوى '+s.level;$('levelFill').style.width=Math.min(100,100*s.xp/lvlGoal(s.level))+'%';$('questBadge').textContent=questDefs.filter(q=>!s.questsClaimed[q.key]).length;}
function spawnOrder(i){const allowed=['wheat','corn','egg','bread','feed',...(s.level>=3?['carrot','milk','wool']:[]),...(s.level>=4?['sugar','cheese']:[]),...(s.level>=5?['strawberry']:[])];const j=Math.floor(rnd(Date.now()%999999+i*31,i+3)*allowed.length);const item=allowed[j];let q=(item==='wheat'||item==='corn'?4+Math.floor(rnd(i,Date.now()%300)*3):item==='egg'?2: item==='feed'?2:1);return {id:Date.now()+i*33,item,qty:q,coins:Math.round(q*(GOODS[item].sell||10)*1.85+20),xp:12+q*4};}
if(!s.orders?.length){s.orders=[{id:1,item:'wheat',qty:5,coins:63,xp:14},{id:2,item:'egg',qty:2,coins:86,xp:18},{id:3,item:'corn',qty:4,coins:75,xp:17}];}
let pointer=null,moving=false,activeSheet='',selectedPlot=null,placeMode=null,toastTimer=null,particles=[],floatings=[],truckAnim=0,weatherShift=0,weatherOn=false;

function itemIcon(k){return GOODS[k]?.icon||'🎁'}
function afford(ingredients){return Object.entries(ingredients).every(([k,n])=>inv(k)>=n)}
function missingText(ingredients){return Object.entries(ingredients).map(([k,n])=>`${itemIcon(k)} ${n} <span style="color:${inv(k)>=n?'#4e9c59':'#d25b51'}">(عندك ${inv(k)})</span>`).join(' + ')}
function pickSeed(plot){selectedPlot=plot;let html='<div class="field-note">اختر محصولًا، ثم ارجع للحقل لما يكبر حتى تحصده. كل محصول ينتج عدة وحدات! 🌻</div><div class="card-grid">';for(let [k,c]of Object.entries(CROPS)){const lock=s.level<c.level;html+=`<div class="item-card"><div class="card-icon">${c.icon}</div><div class="card-name">${c.name}</div><div class="card-desc">⏱️ ${Math.round(c.time/1000)} ثانية · 📦 ${c.yield} محاصيل</div><div class="pill-row"><span class="mini-pill">🪙 ${c.cost}</span><button class="${lock?'muted-btn':'green-btn'}" ${lock||s.coins<c.cost?'disabled':''} data-seed="${k}">${lock?'🔒 مستوى '+c.level:'ازرع 🌱'}</button></div></div>`;}html+='</div>';openSheet('🌱 هيا نزرع!','حقل جاهز لبداية جديدة',html);document.querySelectorAll('[data-seed]').forEach(b=>b.onclick=()=>plant(plot,b.dataset.seed));}

function showCrop(plot){let c=CROPS[plot.crop],remaining=Math.max(0,c.time-(Date.now()-plot.at)),ready=remaining===0;let body=`<div style="text-align:center;font-size:67px;margin:12px">${c.icon}</div><div style="text-align:center;font-size:16px;font-weight:1000">${ready?'محصولك جاهز للحصاد!':'محصولك ينمو الآن...'}</div>${progressBar(100-100*remaining/c.time)}<div class="field-note">${ready?'احصد الآن واحصل على '+c.yield+' محاصيل.':'متبقي '+Math.ceil(remaining/1000)+' ثانية · تستطيع إكمال أعمال المزرعة والعودة لاحقًا.'}</div><button class="green-btn big-action" id="cropAction">${ready?'🌾 احصد المحصول':'✨ أسرع النمو (💎 1)'}</button>`;openSheet(c.icon+' '+c.name,'من حقل مزرعتك',body);$('cropAction').onclick=()=>{if(ready){harvest(plot);closeSheet();}else if(s.gems>0){s.gems--;plot.at=Date.now()-c.time;updateHUD();save();showCrop(plot)}else toast('💎 ما عندك جواهر كافية')};}
function animalSheet(key){
 const c=ANIMALS[key],a=s.animals[key];if(!c||!a)return;
 if(s.level<c.lvl){openSheet('🔒 '+c.name,'حيوانات جديدة تفتح مع تقدمك',`<div style="font-size:70px;text-align:center;margin:12px">🐑</div><div class="field-note">مرعى الأغنام يفتح عند المستوى ${c.lvl}. احصد محاصيلك ولبِّ طلبات الشاحنة لتجمع الخبرة!</div>`);return;}
 const ready=!!(a.ready||(a.end&&Date.now()>=a.end));
 if(ready&&a.end){a.ready=true;a.end=0;save();}
 const busy=!!(a.end&&!ready),seconds=Math.ceil(Math.max(0,(a.end||0)-Date.now())/1000);
 let html=`<div style="text-align:center;font-size:68px;margin:8px">${c.icon}</div><div class="field-note">${c.desc}</div><div style="text-align:center;font-weight:1000;font-size:16px;margin:12px">${ready?'✨ المنتج جاهز للاستلام!':busy?'⏳ الحيوانات تتغذى وتنتج الآن':'🌿 حيواناتك تنتظر وجبتها!'}</div>`;
 if(busy){html+=progressBar(100-100*seconds*1000/c.ms)+`<p style="text-align:center;font-weight:900">متبقي ${seconds} ثانية</p>`;}
 else if(ready){html+=`<button class="green-btn big-action" id="animalAction">${GOODS[c.item].icon} اجمع ${c.qty} ${GOODS[c.item].name}</button>`;}
 else {html+=`<p class="section-title">🌿 الطعام المطلوب</p><div class="field-note">${missingText(c.req)}</div><button class="green-btn big-action" id="animalAction" ${!afford(c.req)?'disabled':''}>🌾 أطعم الحيوانات</button>`;}
 openSheet(c.icon+' '+c.name,'مرحلة الحيوانات • تغذية وإنتاج',html);
 const action=$('animalAction');
 if(action)action.onclick=()=>{
   if(ready){

     if(key==='chicken')s.stats.eggs+=c.qty;
     if(key==='sheep')s.stats.wool=(s.stats.wool||0)+c.qty;
     grantXP(c.xp);bursts(...posOf(c.x,c.y),'#ffe3a4',24);
     floatText(c.x,c.y,'+'+c.qty+' '+GOODS[c.item].icon);
     toast('🎉 جمعت '+c.qty+' '+GOODS[c.item].name);
   } else if(!a.end&&afford(c.req)){
     Object.entries(c.req).forEach(([item,n])=>add(item,-n));
     a.end=Date.now()+c.ms;a.ready=false;toast('💚 بدأ إنتاج '+GOODS[c.item].name+'!');
   }

}
function factorySheet(k){let f=FAC[k];if(s.level<f.lvl){return openSheet('🔒 '+f.name,'المبنى يحتاج تطوير المزرعة',`<div class="empty" style="font-size:40px">🏗️</div><div class="field-note">افتح ${f.name} عند الوصول إلى المستوى ${f.lvl}. اجمع الخبرة من الزراعة والطلبات!</div>`)}let task=s.factories[k];let done=task&&Date.now()>=task.end;let html=`<div class="field-note">${task?done?'✨ تم تجهيز المنتج! اضغط لاستلامه.':'🔥 المصنع يعمل الآن... يمكنك متابعة المزرعة.':'اختر منتجًا لصناعته من محاصيل مزرعتك.'}</div>`;
if(task){let good=GOODS[task.item],r=f.recipes.find(r=>r.item===task.item);html+=`<div class="list-card"><div class="list-icon">${good.icon}</div><div class="list-body"><div class="list-title">${good.name} × ${task.qty}</div><div class="list-desc">${done?'جاهز للاستلام!':'باقي '+Math.ceil((task.end-Date.now())/1000)+' ثانية'}</div>${progressBar(done?100:100-(task.end-Date.now())/r.ms)}</div></div><br><button id="factoryTake" class="${done?'green-btn':'muted-btn'} big-action" ${!done?'disabled':''}>${done?'📦 استلم المنتج':'⏳ جاري الإنتاج'}</button>`;}else{html+='<div class="stack">';for(let r of f.recipes){let lock=s.level<(r.level||1);html+=`<div class="list-card"><div class="list-icon">${itemIcon(r.item)}</div><div class="list-body"><div class="list-title">${GOODS[r.item].name} × ${r.qty||1}</div><div class="list-desc">${missingText(r.ingredients)}<br>⏱️ ${Math.round(r.ms/1000)} ثانية</div></div><button class="${lock?'muted-btn':'orange-btn'}" data-craft="${r.item}" ${lock||!afford(r.ingredients)?'disabled':''}>${lock?'🔒':'اصنع'}</button></div>`;}html+='</div>';}openSheet(f.icon+' '+f.name,'الإنتاج والتصنيع',html);
if(task&&done){$('factoryTake').onclick=()=>{add(task.item,task.qty);s.factories[k]=null;grantXP(f.recipes.find(r=>r.item===task.item).xp);toast('📦 استلمت '+GOODS[task.item].name);bursts(...posOf((STATIC.find(o=>o.type===k)||{x:6}).x,(STATIC.find(o=>o.type===k)||{y:10}).y),'#ffe36b',19);save();factorySheet(k)}}
document.querySelectorAll('[data-craft]').forEach(b=>b.onclick=()=>{let r=f.recipes.find(r=>r.item===b.dataset.craft);if(!r||!afford(r.ingredients))return toast('المكونات غير كافية');Object.entries(r.ingredients).forEach(([item,n])=>add(item,-n));s.factories[k]={item:r.item,qty:r.qty||1,end:Date.now()+r.ms};toast('🔥 بدأ التصنيع!');save();factorySheet(k)});}
function ordersSheet(){let html='<div class="field-note">🚚 جهّز المطلوب وسلمه للسائق. يعطيك عملات ذهبية وخبرة ويجيب لك طلبات جديدة!</div><div class="stack">';for(let [i,o]of s.orders.entries()){let okay=inv(o.item)>=o.qty;html+=`<div class="list-card"><div class="list-icon">${i===0?'🚛':i===1?'📦':'🧑‍🌾'}</div><div class="list-body"><div class="list-title">طلب القرية #${i+1}</div><div class="list-desc">مطلوب: ${itemIcon(o.item)} ${GOODS[o.item].name} <b>${o.qty}</b> (عندك ${inv(o.item)})</div><div class="list-desc" style="color:#58883b;font-weight:950">🪙 ${o.coins} + ⭐ ${o.xp}</div></div><button data-order="${i}" class="${okay?'green-btn':'muted-btn'}" ${okay?'':'disabled'}>سلّم</button></div>`;}html+='</div>';openSheet('🚚 طلبات القرية','اربح من منتجات مزرعتك',html);document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{let i=+b.dataset.order,o=s.orders[i];if(!o||inv(o.item)<o.qty)return;add(o.item,-o.qty);money(o.coins);grantXP(o.xp);s.stats.orders++;truckAnim=Date.now();floatText(12,13,'🪙 +'+o.coins);s.orders[i]=spawnOrder(i+Math.floor(Math.random()*100));save();toast('🚚 تم توصيل الطلب! +'+o.coins+' عملة');ordersSheet()});}

for(let o of actors){let [xx,yy]=proj(o.x,o.y);ctx.save();ctx.translate(xx,yy);if(o.t==='plot')plotArt(o.data);else if(o.t==='house')house();else if(o.t==='barn')barn();else if(o.t==='chicken')coop();else if(o.t==='cow')cowBarn();else if(o.t==='sheep')sheepPen();else if(o.t==='bakery')bakery();else if(o.t==='dairy')dairy();else if(o.t==='mill')mill();else if(o.t==='sugarmill')sugarMill();else if(o.t==='pond')pond();else if(o.t==='orchard')orchard();else if(o.t==='market')marketStall();else if(o.t==='truck')truck();else if(o.t==='decor')decorDraw(o.data);else if(o.t==='farmer')farmer();else if(o.t==='tree')tree(0,0,(.65+o.seed*.35),o.seed>.8);else if(o.t==='bush')bush(0,0,.5+o.seed*.4,o.seed>.7);
if(['chicken','cow','sheep'].includes(o.t))animalBubble(o.t);
 if(['dairy','sugarmill'].includes(o.t)&&s.level<FAC[o.t].lvl){oval(0,-92,17,17,'#f7dc9e','#bb8756',2);txt('🔒',0,-93,17,'white',null,0)}
if(['bakery','dairy','mill','sugarmill'].includes(o.t)&&s.factories[o.t]){let t=s.factories[o.t];if(Date.now()>=t.end){oval(0,-122+Math.sin(tick*3)*3,14,14,'#fff9d4','#e8b15a',2);txt('✓',0,-124+Math.sin(tick*3)*3,14,'#55b35b',null,0)}else{for(let i=0;i<3;i++){let a=(tick*.65+i*.9)%2.7;oval(32+Math.sin(i+a)*6,-100-a*19,5+a*2,3+a,'#fffbe6'+(a<1?'b6':'59'))}}}
ctx.restore();}
const bugs=[[4.5,3.5],[10.8,5.2],[9.3,12.3],[2.4,4.1]];for(let i=0;i<bugs.length;i++){let p=bugs[i],px=proj(p[0]+Math.sin(tick*.33+i)*.4,p[1]+Math.cos(tick*.37+i)*.35);ctx.save();ctx.translate(px[0],px[1]-45);butterfly(0,0,.85);ctx.restore()}ctx.restore();}
function canOccupyForScenery(x,y){return s.plots.some(p=>p.x===x&&p.y===y)||s.decors.some(p=>p.x===x&&p.y===y)||STATIC.some(p=>Math.abs(p.x-x)<(p.span||1)+.2&&Math.abs(p.y-y)<(p.span||1)+.2)}
function rain(){ctx.save();ctx.strokeStyle='#ddfaff9c';ctx.lineWidth=1.4;for(let i=0;i<110;i++){let x=(rnd(i,111)*sw+tick*80)%sw,y=(rnd(i,919)*sh+tick*580)%sh;line(x,y,x-6,y+16,'#e8ffffaa',1.4)}ctx.restore()}
function shadeScene(){let day=(Math.sin(Date.now()/1000/75)+1)/2;let amt=Math.max(0,.25-day*.39);if(amt>.04){ctx.fillStyle=`rgba(30,55,105,${Math.min(.27,amt)})`;ctx.fillRect(0,0,sw,sh)}for(let i=0;i<11;i++){let x=rnd(i,33)*sw,y=rnd(i,77)*sh;let v=(Math.sin(tick*2+i)+1)/2;oval(x,y,1+2*v,1+2*v,'rgba(255,250,170,'+(v*.15)+')')}}
function bursts(x,y,col='#ffee81',n=10){for(let i=0;i<n;i++){let a=Math.PI*2*i/n,sp=40+Math.random()*95;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-45,life:1,c:col,s:3+Math.random()*5})}}
function floatText(x,y,t){let [xx,yy]=posOf(x,y);floatings.push({x:xx,y:yy,txt:t,life:1})}
function renderParticles(dt){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=135*dt;p.life-=dt*1.4;if(p.life<=0){particles.splice(i,1);continue}ctx.globalAlpha=p.life;ctx.save();ctx.translate(p.x,p.y);ctx.rotate((1-p.life)*3);roundRect(-p.s/2,-p.s/2,p.s,p.s,2,p.c);ctx.restore()}ctx.globalAlpha=1;for(let i=floatings.length-1;i>=0;i--){let p=floatings[i];p.y-=22*dt;p.life-=dt*.72;if(p.life<=0){floatings.splice(i,1);continue}ctx.globalAlpha=p.life;txt(p.txt,p.x,p.y,17,'#fffddc','#5b8f3d',3)}ctx.globalAlpha=1;}
let lastT=performance.now();function animate(t){let dt=Math.min(.06,(t-lastT)/1000);lastT=t;tick+=dt;frame++;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,sw,sh);details();renderWorld();shadeScene();if(weatherOn)rain();renderParticles(dt);if(frame%45===0){for(let a of Object.values(s.animals))if(a.end&&a.end<=Date.now()){a.ready=true;a.end=0;save()}}requestAnimationFrame(animate)}
function handleTap(sx,sy){let c=cellAt(sx,sy),x=c.x,y=c.y;if(x<0||x>=MAP||y<0||y>=MAP)return; if(placeMode){putDecor(x,y);return;}let p=s.plots.find(p=>p.x===x&&p.y===y);if(p){if(!p.crop)pickSeed(p);else harvest(p);return}
let candidates=STATIC.filter(o=>Math.abs(o.x-x)<(o.span||1)&&Math.abs(o.y-y)<(o.span||1));let o=candidates.sort((a,b)=>Math.abs(a.x-x)+Math.abs(a.y-y)-Math.abs(b.x-x)-Math.abs(b.y-y))[0];if(o){switch(o.type){case'chicken':animalSheet('chicken');return;case'cow':animalSheet('cow');return;case'sheep':animalSheet('sheep');return;case'bakery':case'mill':case'dairy':case'sugarmill':factorySheet(o.type);return;case'truck':ordersSheet();return;case'market':marketSheet();return;case'house':questSheet();return;case'barn':plantsSheet();return;case'pond':toast('🦆 أجواء هادئة عند بركة البط');return;case'orchard':toast('🍎 قريبًا: أشجار الفاكهة المثمرة');return}}
let deco=s.decors.find(o=>o.x===x&&o.y===y);if(deco){toast('🌻 زينة جميلة!');return}
if(s.plots.length<PLOT_POS.length&&PLOT_POS.slice(s.plots.length).some(p=>p[0]===x&&p[1]===y)){toast('🌱 اضغط على السوق لتشتري حقلًا هنا!');return}
}
const pointers=new Map();let tapStart=null;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){tapStart={x:e.clientX,y:e.clientY,time:Date.now()};moving=false}else tapStart=null});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){let dx=e.clientX-prev.x,dy=e.clientY-prev.y;panX+=dx;panY+=dy;if(tapStart&&Math.hypot(tapStart.x-e.clientX,tapStart.y-e.clientY)>8)moving=true;}else if(pointers.size===2){let arr=[...pointers.values()],ids=[...pointers.keys()];let other=arr[ids.indexOf(e.pointerId)===0?1:0];let prevDist=Math.hypot(prev.x-other.x,prev.y-other.y);let nextDist=Math.hypot(e.clientX-other.x,e.clientY-other.y);if(prevDist>4)zoom=Math.max(.52,Math.min(1.65,zoom*nextDist/prevDist));moving=true;}panX=Math.max(-950,Math.min(950,panX));panY=Math.max(-720,Math.min(720,panY));});canvas.addEventListener('pointerup',e=>{if(!moving&&tapStart&&pointers.size===1&&Date.now()-tapStart.time<700)handleTap(e.clientX,e.clientY);pointers.delete(e.pointerId);tapStart=null});canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);tapStart=null});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.52,Math.min(1.65,zoom+(e.deltaY>0?-.07:.07)))},{passive:false});
weatherOn=s.weather;updateHUD();setTimeout(()=>hints('👆 اضغط على الحقول البنية للزراعة • اسحب لتتجول • قرّب بإصبعين'),3000);requestAnimationFrame(animate);setInterval(save,15000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.sunnyFarmDebug={get state(){return s},plant,handleTap,posOf,cellAt,openShop:marketSheet,openOrders:ordersSheet,openFactories:factoriesOverview,openAnimals:animalsOverview,render:renderWorld};
})();
