<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#578d43"><meta name="apple-mobile-web-app-capable" content="yes">
<title>مزرعة الشمس | مزرعة تفاعلية</title>
<style>
:root{--gold:#ffd978;--ink:#5a361e;--brown:#99643c;--wood:#d29a58;--cream:#fff6dc;--green:#52ad49}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:radial-gradient(circle,#85b965,#335b3d);touch-action:manipulation;color:var(--ink)}
button{font:inherit;cursor:pointer;user-select:none;-webkit-user-select:none}button:focus-visible{outline:3px solid #ffffff;outline-offset:3px}
#frame{width:min(100vw,600px);height:100dvh;position:relative;margin:auto;overflow:hidden;background:#628b4c;box-shadow:0 0 50px #18362288;isolation:isolate}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none;object-fit:fill}
#light{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,transparent 74%,#283a2440 86%,#10251340);mix-blend-mode:multiply}
.hotspot{position:absolute;z-index:3;outline:0;border:2px solid transparent;border-radius:22px;background:transparent;touch-action:manipulation;color:white}
.hotspot:active,.hotspot:focus-visible{border-color:#fff3bb;box-shadow:inset 0 0 23px #ffffa554,0 0 20px #f7d45f66}
.hotspot[aria-label^='حقل']{border-radius:35% 16% 40% 19%;transform:rotate(-3deg)}
#field1{left:1%;top:34%;width:49%;height:15%}#field2{left:8%;top:47%;width:44%;height:15%}
#home{left:29%;top:11%;width:43%;height:17%}#barn{left:62%;top:30%;width:34%;height:20%}
#cow{left:83%;top:45%;width:15%;height:9%}#chickens{left:60%;top:43%;width:18%;height:12%}
#well{left:43%;top:63%;width:15%;height:9%}#lake{left:52%;top:74%;width:42%;height:12%}
#quests{left:1%;top:10%;width:15%;height:9%}#orders{right:1%;top:11%;width:20%;height:10%}
#nav-shop{left:2%;top:87.5%;width:16%;height:10%}#nav-crops{left:19%;top:87.5%;width:16%;height:10%}#nav-animals{left:35%;top:87.5%;width:16%;height:10%}#nav-decor{left:51%;top:87.5%;width:16%;height:10%}#nav-map{left:67%;top:87.5%;width:16%;height:10%}#nav-friends{left:83%;top:87.5%;width:16%;height:10%}
.stats{position:absolute;z-index:6;top:max(9px,env(safe-area-inset-top));right:2%;display:flex;align-items:center;gap:5px;direction:rtl}
.stat{background:linear-gradient(#52402e,#211a15);border:2px solid #f9d892;border-bottom:4px solid #9c672f;border-radius:20px;padding:3px 8px;color:#fff5d6;font-size:clamp(11px,3.4vw,17px);font-weight:1000;box-shadow:0 3px 8px #1c160d66;white-space:nowrap;text-shadow:0 2px #27180d}
.stat span{margin-left:3px}.stat:active{transform:scale(.96)}
.level{position:absolute;z-index:6;left:2%;top:6.0%;display:flex;align-items:center;gap:5px;padding:3px 9px;background:linear-gradient(#fff6d5,#eec483);color:#6a3b1e;border:2px solid #f7edc9;border-radius:24px;box-shadow:0 4px 0 #93552b;font-weight:1000;font-size:13px;direction:ltr}
.level b{font-size:17px}.level small{font-size:10px;color:#8f552b}
.counter{pointer-events:none;position:absolute;z-index:4;left:4%;top:27%;background:#fff1c8ee;border:2px solid #f9d879;border-radius:14px;color:#67401e;padding:5px 10px;box-shadow:0 3px 0 #936038aa;font-size:11px;font-weight:900;max-width:39%}
.bubble{position:absolute;z-index:4;pointer-events:none;background:linear-gradient(#fffada,#efc777);border:2px solid #fef4ce;border-bottom:4px solid #a56a2e;border-radius:16px;padding:5px 10px;box-shadow:0 6px 10px #492e1640;color:#633b1b;font-size:11px;font-weight:1000;text-align:center;min-width:95px}
#fieldStatus{left:7%;top:40.5%;transform:translateY(-50%);animation:bob 3s ease-in-out infinite}#animalStatus{right:4%;top:51%}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -4px}}
#toast{position:absolute;bottom:14%;z-index:25;left:8%;right:8%;min-height:20px;text-align:center;padding:11px 12px;background:#372715ee;color:#fff6d8;border:2px solid #f9da91;border-radius:19px;box-shadow:0 9px 25px #21140780;font-size:13px;font-weight:900;pointer-events:none;opacity:0;transform:translateY(20px);transition:.25s}#toast.show{opacity:1;transform:translateY(0)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:5}
.floating{position:absolute;z-index:5;pointer-events:none;color:#fff5d1;font-size:22px;font-weight:1000;text-shadow:0 2px 5px #432611,1px 1px #723b1f;animation:fly 1.5s both}@keyframes fly{0%{opacity:0;transform:translateY(15px) scale(.6)}20%{opacity:1}100%{transform:translateY(-75px) scale(1.15);opacity:0}}
.spark{position:absolute;z-index:5;pointer-events:none;width:7px;height:7px;background:#fff4ad;box-shadow:0 0 10px #ffef6a;border-radius:50%;animation:burst .8s ease-out forwards}@keyframes burst{100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.2)}}
#shade{position:absolute;inset:0;z-index:15;background:#1d1f1b88;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}#shade.open{display:flex}
#dialog{width:100%;max-height:min(76dvh,720px);overflow:auto;overscroll-behavior:contain;background:linear-gradient(#fff7df,#f5d9a8);border:4px solid #ffe9b9;border-bottom:0;border-radius:28px 28px 0 0;box-shadow:0 -16px 50px #34250b76;padding:14px 13px calc(17px + env(safe-area-inset-bottom));animation:slide .25s ease-out}
@keyframes slide{from{transform:translateY(40px);opacity:.5}to{transform:translateY(0);opacity:1}}
.head{display:flex;align-items:start;justify-content:space-between;gap:12px;border-bottom:2px dashed #dbb77c;padding-bottom:10px;margin-bottom:12px}.head h2{font-size:21px;color:#754523;margin:0}.head p{font-size:11px;color:#8c6541;margin:3px 0 0;font-weight:700}.close{background:#fff6df;color:#8b4a26;border:2px solid #cb9b69;width:34px;height:34px;border-radius:50%;font-size:23px;font-weight:900}
.notice{padding:12px;background:#fdf2d6;border:1.5px solid #e2bb80;border-radius:16px;font-size:13px;line-height:1.7;margin:10px 0;font-weight:750}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{background:linear-gradient(#fffdf0,#f5dfb9);border:2px solid #deb77c;border-radius:18px;padding:12px;text-align:center;min-width:0;box-shadow:0 3px 0 #c29256}.item .icon{font-size:32px;line-height:1.3}.item .name{font-size:14px;font-weight:1000;margin:3px 0 5px}.item small{display:block;color:#916338;font-size:11px;font-weight:750;margin:3px 0 8px}.item strong{display:block;font-size:11px}
.action{color:#fff8d9;background:linear-gradient(180deg,#78d46a,#368d34);border:2px solid #e8f0bc;border-bottom:5px solid #206b2b;border-radius:13px;padding:9px 12px;font-weight:1000;font-size:13px;box-shadow:0 3px 5px #416b362b}.action:active{transform:translateY(2px);border-bottom-width:2px}.action:disabled{background:#b0b5a6;border-color:#e2e6d9;opacity:.64;color:#f6f4e7}.action.gold{background:linear-gradient(#f8c875,#d58c41);border-bottom-color:#975224}.action.full{width:100%;padding:12px;font-size:16px;margin-top:12px}
.rowitem{display:flex;align-items:center;gap:10px;background:#fff4da;border:1.5px solid #d8ae71;border-radius:16px;padding:10px;margin:7px 0}.rowitem .ico{font-size:32px;min-width:35px}.rowitem .info{min-width:0;flex:1;font-size:13px;font-weight:950}.rowitem small{display:block;font-size:11px;color:#99704b;line-height:1.5;margin-top:2px}.rowitem button{flex:none}
.progress{border-radius:20px;border:2px solid #c48d4e;background:#bfa98b;height:15px;overflow:hidden;margin:7px 0}.progress span{background:linear-gradient(#a9e86f,#4da63f);display:block;height:100%;transition:width .3s}
.badge{display:inline-flex;gap:4px;background:#fff6d5;border:1px solid #dfbf83;border-radius:30px;padding:5px 9px;font-size:12px;font-weight:1000;color:#714822;margin:4px}
@media (min-width:600px){.stat{font-size:17px}.counter{font-size:14px}.bubble{font-size:13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),savedKey='sunny_farm_art_v1',oldKey='sunny_farm_valley_v3',now=()=>Date.now();
const GOODS={wheat:['قمح','🌾',6],corn:['ذرة','🌽',9],carrot:['جزر','🥕',12],egg:['بيض','🥚',18],milk:['حليب','🥛',25],wool:['صوف','🧶',40],bread:['خبز','🥖',50],cheese:['جبن','🧀',65],feed:['علف','🌿',16],water:['ماء','💧',5]};
const CROPS={wheat:{name:'القمح الذهبي',icon:'🌾',time:22000,seed:2,qty:4,level:1,xp:8},corn:{name:'الذرة الحلوة',icon:'🌽',time:38000,seed:4,qty:4,level:2,xp:11},carrot:{name:'الجزر',icon:'🥕',time:55000,seed:6,qty:4,level:3,xp:14}};
const ANIMALS={chicken:{name:'حظيرة الدجاج',icon:'🐔',item:'egg',qty:2,feed:{wheat:2},duration:36000,xp:12,level:1},cow:{name:'مرعى الأبقار',icon:'🐄',item:'milk',qty:2,feed:{corn:2},duration:52000,xp:16,level:2},sheep:{name:'مرعى الأغنام',icon:'🐑',item:'wool',qty:2,feed:{wheat:2,feed:1},duration:70000,xp:23,level:3}};
const RECIPES={bread:{item:'bread',name:'خبز المخبز',icon:'🥖',need:{wheat:3},duration:40000,xp:18},cheese:{item:'cheese',name:'جبن الألبان',icon:'🧀',need:{milk:2},duration:60000,xp:26},feed:{item:'feed',name:'علف الحيوانات',icon:'🌿',need:{corn:1,wheat:2},duration:30000,qty:3,xp:12}};
function fresh(){let inv={wheat:7,corn:5,carrot:0,egg:0,milk:0,wool:0,bread:0,cheese:0,feed:2,water:0},coins=1250,gems=24,level=2,xp=15;try{let old=JSON.parse(localStorage.getItem(oldKey)||'null');if(old&&old.inventory){coins=old.coins??coins;gems=old.gems??gems;level=old.level??level;xp=old.xp??xp;inv={...inv,...old.inventory};}}catch{}return {coins,gems,level,xp,inv,fields:[{crop:'wheat',at:now()-100000},{crop:'wheat',at:now()-100000}],animals:{chicken:{end:0,ready:true},cow:{end:0,ready:false},sheep:{end:0,ready:false}},jobs:[],orders:[],waterAt:0,decors:0,completed:{harvest:0,animals:0,orders:0}};}
let s=fresh();try{let data=JSON.parse(localStorage.getItem(savedKey)||'null');if(data&&data.inv){const base=fresh();s={...base,...data,inv:{...base.inv,...data.inv},animals:{...base.animals,...data.animals},completed:{...base.completed,...data.completed}};}}catch{}
const total=n=>(+n||0).toLocaleString('en-US');const item=k=>GOODS[k]?.[1]||'📦';const name=k=>GOODS[k]?.[0]||k;const count=k=>s.inv[k]||0;
function save(){try{localStorage.setItem(savedKey,JSON.stringify(s))}catch{}};
function gainXP(x){s.xp+=x;while(s.xp>=80+s.level*35){s.xp-=80+s.level*35;s.level++;s.coins+=s.level*70;toast('🎉 مبروك وصلت المستوى '+s.level)}drawHUD()}
function add(k,n){s.inv[k]=Math.max(0,count(k)+n);drawHUD()};function canPay(o){return Object.entries(o).every(([k,q])=>count(k)>=q)}
function spend(o){if(!canPay(o))return false;for(const [k,q]of Object.entries(o))add(k,-q);return true};
function reqText(o){return Object.entries(o).map(([k,v])=>`${item(k)} ${v} <b style="color:${count(k)>=v?'#3e9a35':'#c94e42'}">(عندك ${count(k)})</b>`).join(' + ')};
function drawHUD(){$('coins').innerHTML=`🪙 ${total(s.coins)}`;$('gems').innerHTML=`💎 ${total(s.gems)}`;$('level').innerHTML=`⭐ <b>${total(s.level)}</b> <small>${total(s.xp)} XP</small>`;
 const ready=s.fields.filter(f=>f.crop&&now()-f.at>=CROPS[f.crop].time).length;$('fieldStatus').textContent=ready?`✨ ${ready} جاهز للحصاد`:'🌱 المحاصيل تنمو';
 const has=Object.values(s.animals).some(a=>a.ready||a.end&&now()>=a.end);$('animalStatus').textContent=has?'🥚 منتجات جاهزة!':'🐄 أطعم الحيوانات';
}
let tid;function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(tid);tid=setTimeout(()=>t.classList.remove('show'),2700)}
function float(msg,x=.43,y=.43){let el=document.createElement('span');el.className='floating';el.textContent=msg;el.style.left=x*100+'%';el.style.top=y*100+'%';$('fx').appendChild(el);setTimeout(()=>el.remove(),1600)}
function sparkle(x,y){for(let i=0;i<12;i++){let e=document.createElement('i');e.className='spark';e.style.left=x*100+'%';e.style.top=y*100+'%';let a=i/12*Math.PI*2;e.style.setProperty('--x',Math.cos(a)*(40+Math.random()*45)+'px');e.style.setProperty('--y',Math.sin(a)*(25+Math.random()*60)+'px');$('fx').append(e);setTimeout(()=>e.remove(),900)}}
function open(title,sub,content){$('dialog').innerHTML=`<header class="head"><div><h2>${title}</h2><p>${sub||''}</p></div><button class="close" id="close" aria-label="إغلاق">×</button></header>${content}`;$('shade').classList.add('open');$('close').onclick=close}
function close(){$('shade').classList.remove('open')}
$('shade').addEventListener('click',e=>{if(e.target===$('shade'))close()});window.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function field(i){let f=s.fields[i],crop=f.crop&&CROPS[f.crop],done=crop&&now()-f.at>=crop.time;
 if(done){let html=`<div class="notice">${crop.icon} محصول <b>${crop.name}</b> جاهز للحصاد! اضغط الزر واجمع ${crop.qty} وحدات.</div><button class="action full" id="harvest">🌾 احصد المحصول +${crop.qty}</button>`;open('🌾 موسم الحصاد','حقل رقم '+(i+1),html);$('harvest').onclick=()=>{add(f.crop,crop.qty);s.fields[i]={crop:null,at:0};s.completed.harvest++;gainXP(crop.xp);sparkle(i?.32:.18,i?.53:.41);float('+'+crop.qty+' '+crop.icon,i?.35:.19,i?.54:.42);toast('🌟 حصاد ممتاز!');save();close()};return;}
 if(crop){let seconds=Math.ceil(Math.max(0,crop.time-(now()-f.at))/1000),p=Math.min(100,(now()-f.at)/crop.time*100);open(crop.icon+' المحصول ينمو','الحقل رقم '+(i+1),`<div class="notice">🌱 ${crop.name} · بقي ${seconds} ثانية</div><div class="progress"><span style="width:${p}%"></span></div><button class="action full" id="speed" ${s.gems<1?'disabled':''}>💎 تسريع النمو بجوهرة</button>`);$('speed').onclick=()=>{if(s.gems<1)return;s.gems--;f.at=now()-crop.time;save();drawHUD();field(i)};return;}
 let html='<div class="notice">اختر البذرة، ثم عُد إلى الحقل عندما ينتهي وقت النمو.</div><div class="grid">';for(let [k,c]of Object.entries(CROPS)){const locked=s.level<c.level;html+=`<div class="item"><div class="icon">${c.icon}</div><div class="name">${c.name}</div><small>⏱️ ${c.time/1000} ث · 📦 ${c.qty} وحدات</small><button class="action" data-plant="${k}" ${locked||s.coins<c.seed?'disabled':''}>${locked?'🔒 مستوى '+c.level:'🪙 '+c.seed+' · ازرع'}</button></div>`;}html+='</div>';open('🌱 ازرع حقلًا','الحقل رقم '+(i+1),html);
 document.querySelectorAll('[data-plant]').forEach(b=>b.onclick=()=>{let c=CROPS[b.dataset.plant];if(!c||s.level<c.level||s.coins<c.seed)return;s.coins-=c.seed;s.fields[i]={crop:b.dataset.plant,at:now()};gainXP(2);save();drawHUD();float('🌱 تم الزرع',i?.35:.19,i?.54:.42);close()})}
function animals(){let html='<div class="notice">أطعم الحيوانات، انتظر انتهاء المؤقت، وبعدها اجمع البيض والحليب والصوف. المؤقتات تستمر حتى لو قفلت Safari.</div>';
 for(let [k,c]of Object.entries(ANIMALS)){let a=s.animals[k],locked=s.level<c.level,ready=a.ready||(a.end&&now()>=a.end);html+=`<div class="rowitem"><div class="ico">${c.icon}</div><div class="info">${c.name}<small>${locked?'🔒 يفتح المستوى '+c.level:ready?'✨ المنتجات جاهزة للاستلام':a.end?'⏱️ باقي '+Math.ceil((a.end-now())/1000)+' ث':'🌿 تحتاج وجبة علف'} · ${item(c.item)} ×${c.qty}</small></div><button class="action" data-animal="${k}">${locked?'🔒':'زيارة'}</button></div>`;}
 open('🐮 حيوانات المزرعة','الإنتاج اليومي',html);document.querySelectorAll('[data-animal]').forEach(b=>b.onclick=()=>animal(b.dataset.animal))}
function animal(k){const c=ANIMALS[k],a=s.animals[k];if(s.level<c.level){open('🔒 '+c.name,'تفتح عند المستوى '+c.level,`<div class="notice">🌟 ارفع مستواك عن طريق الحصاد والطلبات وستفتح هذه الحظيرة.</div>`);return}
 const done=a.ready||(a.end&&now()>=a.end),working=a.end&&!done,remaining=Math.ceil(Math.max(0,(a.end||0)-now())/1000);
 let html=`<div style="font-size:65px;text-align:center">${c.icon}</div><div class="notice">${done?'✨ الحيوانات سعيدة، والمنتج جاهز للجمع!':working?'⏱️ الحيوانات تتغذى الآن وتستعد للإنتاج':'🌾 أطعم الحيوانات لتحصل على منتجات جديدة.'}</div>`;
 if(done)html+=`<button class="action full" id="animalAct">${item(c.item)} اجمع ${c.qty} ${name(c.item)}</button>`;
 else if(working)html+=`<div class="progress"><span style="width:${Math.max(0,100-(a.end-now())/c.duration*100)}%"></span></div><div class="notice">باقي ${remaining} ثانية</div>`;
 else html+=`<div class="notice">الغذاء المطلوب: ${reqText(c.feed)}</div><button class="action full" id="animalAct" ${canPay(c.feed)?'':'disabled'}>🌿 أطعم الحيوانات</button>`;
 open(c.icon+' '+c.name,'منتجات عالية الجودة',html);const b=$('animalAct');if(b)b.onclick=()=>{
  if(done){add(c.item,c.qty);a.end=0;a.ready=false;s.completed.animals++;gainXP(c.xp);sparkle(.77,.50);float('+'+c.qty+' '+item(c.item),.75,.50);toast('🎉 جمعت '+name(c.item));}
  else if(spend(c.feed)){a.end=now()+c.duration;a.ready=false;toast('💚 بدأ إنتاج '+name(c.item));}
  save();drawHUD();animal(k);
 };
}
function manufacturing(){let html='<div class="notice">حوّل محاصيلك ومنتجات الحيوانات إلى منتجات قيمة باستخدام المخبز ومعمل الألبان ومطحنة العلف.</div>';
 for(let [k,c]of Object.entries(RECIPES)){let j=s.jobs.find(v=>v.item===k),ready=j&&now()>=j.end;html+=`<div class="rowitem"><span class="ico">${c.icon}</span><div class="info">${c.name}<small>${j?ready?'✅ جاهز للاستلام':'⏳ باقي '+Math.ceil((j.end-now())/1000)+' ثانية':reqText(c.need)}</small></div><button class="action" data-job="${k}" ${(!j&&!canPay(c.need))?'disabled':''}>${j?ready?'استلم':'انتظر':'اصنع'}</button></div>`;}
 open('🏭 مصانع المزرعة','المخبز • الألبان • العلف',html);document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>{let k=b.dataset.job,c=RECIPES[k],j=s.jobs.find(x=>x.item===k);if(j){if(now()<j.end)return toast('⏱️ المنتج لسه ما خلص');add(k,c.qty||1);s.jobs=s.jobs.filter(v=>v!==j);gainXP(c.xp);sparkle(.43,.24);toast('📦 تم استلام '+c.name)}else{if(!spend(c.need))return;s.jobs.push({item:k,end:now()+c.duration});toast('🔥 بدأ تصنيع '+c.name)}save();manufacturing()})}
function inventory(){let html='<div class="notice">كل منتجات مزرعتك محفوظة هنا. تقدر تبيع الفائض مقابل العملات.</div><div class="grid">';for(let [k,g]of Object.entries(GOODS)){html+=`<div class="item"><div class="icon">${g[1]}</div><div class="name">${g[0]}</div><small>عندك ${count(k)} · سعر البيع 🪙 ${g[2]}</small><button class="action gold" data-sell="${k}" ${count(k)?'':'disabled'}>بيع وحدة</button></div>`;}html+='</div>';open('🧺 مستودع المزرعة','محاصيل ومنتجات',html);document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{let k=b.dataset.sell;if(count(k)<1)return;add(k,-1);s.coins+=GOODS[k][2];drawHUD();save();toast('🪙 بعت '+name(k));inventory()})}
function orders(){if(!s.orders.length)s.orders=[{item:'wheat',qty:3,coins:85,xp:15},{item:'egg',qty:2,coins:120,xp:19},{item:'corn',qty:3,coins:110,xp:18}];let html='<div class="notice">🚚 جهز الطلبات وسلمها للشاحنة مقابل الذهب والخبرة. بعد التسليم يصلك طلب جديد.</div>';s.orders.forEach((o,i)=>html+=`<div class="rowitem"><div class="ico">📦</div><div class="info">طلب رقم ${i+1}<small>${item(o.item)} ${name(o.item)} ×${o.qty} (لديك ${count(o.item)})</small><small>🪙 ${o.coins} + ⭐ ${o.xp}</small></div><button class="action" data-order="${i}" ${count(o.item)>=o.qty?'':'disabled'}>سلّم</button></div>`);
 open('🚚 طلبات القرية','شاحنة التوصيل',html);document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{const i=+b.dataset.order,o=s.orders[i];if(!o||count(o.item)<o.qty)return;add(o.item,-o.qty);s.coins+=o.coins;s.completed.orders++;gainXP(o.xp);sparkle(.68,.65);toast('🪙 +'+o.coins+' عملة');let candidates=['wheat','corn','egg','milk','bread'].filter(k=>s.level>=2||!['milk','bread'].includes(k));let key=candidates[Math.floor(Math.random()*candidates.length)];s.orders[i]={item:key,qty:key==='wheat'||key==='corn'?3:1,coins:60+GOODS[key][2]*4,xp:18};save();orders()})}
function crops(){let html='<div class="notice">🌱 المس أي حقل في المزرعة لتزرع أو تحصد. اختر الحقل من هنا أيضًا.</div>';for(let i=0;i<s.fields.length;i++){let f=s.fields[i],c=f.crop?CROPS[f.crop]:null,ready=c&&now()-f.at>=c.time;html+=`<div class="rowitem"><span class="ico">${c?c.icon:'🌱'}</span><div class="info">الحقل ${i+1}<small>${c?ready?'جاهز للحصاد':'ينمو: '+Math.ceil((c.time-(now()-f.at))/1000)+' ث':'فارغ وجاهز للزراعة'}</small></div><button class="action" data-field="${i}">فتح</button></div>`;}open('🌾 الزراعة والحصاد','محاصيل المزرعة',html);document.querySelectorAll('[data-field]').forEach(b=>b.onclick=()=>field(+b.dataset.field))}
function decoration(){open('🌷 زينة المزرعة','لمسات جميلة لمزرعتك',`<div class="notice">🌻 اشترِ الزهور وأضف لمسة جميلة لمزرعتك. سيتم حفظ مشترياتك ويمكنك رؤية لمعان الزينة حول الحديقة.</div><div class="item"><div class="icon">🌷🌼</div><div class="name">مجموعة زهور</div><small>🪙 65 · لديك ${s.decors}</small><button class="action full" id="buyDecor" ${s.coins<65?'disabled':''}>اشترِ مجموعة زهور</button></div>`);$('buyDecor').onclick=()=>{if(s.coins<65)return;s.coins-=65;s.decors++;sparkle(.27,.67);gainXP(5);save();toast('🌺 زينت مزرعتك بالزهور');decoration()}}
function missions(){let defs=[['harvest','🌾','احصد 5 مرات',5,110],['animals','🐮','اجمع منتجات الحيوانات 4 مرات',4,150],['orders','🚚','سلّم 3 طلبات',3,210]];let html='<div class="notice">أكمل مهام المزرعة للحصول على مكافآت ذهبية.</div>';defs.forEach(([k,icon,desc,target,reward])=>{let val=s.completed[k]||0;html+=`<div class="rowitem"><span class="ico">${icon}</span><div class="info">${desc}<small>${Math.min(val,target)} / ${target} · 🪙 ${reward}</small><div class="progress"><span style="width:${Math.min(100,val/target*100)}%"></span></div></div><button class="action gold" data-quest="${k}" ${val>=target&&!s.completed[k+'Claimed']?'':'disabled'}>استلم</button></div>`});open('📜 مهام المزرعة','جوائز وتحديات',html);document.querySelectorAll('[data-quest]').forEach(b=>b.onclick=()=>{let k=b.dataset.quest,d=defs.find(x=>x[0]===k);if(!d||s.completed[k]<d[3]||s.completed[k+'Claimed'])return;s.completed[k+'Claimed']=true;s.coins+=d[4];save();drawHUD();toast('🎉 مكافأة '+d[4]+' عملة');missions()})}
function info(title,body){open(title,'مزرعة الشمس',`<div class="notice">${body}</div>`)}
function collectWater(){if(now()-s.waterAt<30000)return toast('💧 البئر يحتاج '+Math.ceil((30000-now()+s.waterAt)/1000)+' ثانية');s.waterAt=now();add('water',2);sparkle(.51,.70);float('+2 💧',.50,.69);save();toast('💧 جمعت الماء من البئر!')}
function on(id,fn){$(id).addEventListener('click',()=>{ $('tutorial').style.display='none';fn()})}
on('field1',()=>field(0));on('field2',()=>field(1));on('home',()=>missions());on('barn',inventory);on('cow',()=>animal('cow'));on('chickens',()=>animal('chicken'));on('well',collectWater);on('lake',()=>info('🦆 بحيرة المزرعة','بركة جميلة فيها زهور اللوتس وقارب خشبي، ويمكنك جمع الماء من البئر بجانبها.'));
on('quests',missions);on('orders',orders);on('nav-shop',inventory);on('nav-crops',crops);on('nav-animals',animals);on('nav-decor',decoration);on('nav-map',()=>info('🗺️ خريطة المزرعة','هذه منطقتك الأساسية: الحقول، بيت المزرعة، الحظيرة، والبئر. التوسعات القادمة ستكون مناطق جديدة قابلة للفتح.'));on('nav-friends',()=>info('👫 الأصدقاء','ميزة زيارة مزارع الأصدقاء تحتاج ربطًا بخادم؛ هذه النسخة تعمل وحدها على Safari بدون تسجيل.'));
on('coins',inventory);on('gems',()=>info('💎 الجواهر','تستطيع استخدام الجواهر لتسريع نمو المحاصيل.'));on('level',missions);
setInterval(()=>{drawHUD();if(!$('shade').classList.contains('open'))save()},1800);window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
drawHUD();save();setTimeout(()=>{if($('tutorial'))$('tutorial').style.display='none'},11500);
window.sunnyFarmDebug={get state(){return s},field,animals,animal,manufacturing,orders,inventory,save,drawHUD};
})();
</script>
</body></html>
