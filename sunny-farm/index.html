x;color:white;background:linear-gradient(180deg,#74d871,#369f54);border:2px solid #c9ffc5;border-bottom:4px solid #277a46;font-weight:950;font-size:12px;padding:9px 12px;text-shadow:0 1px #367537;box-shadow:0 4px 9px #30783d20;white-space:nowrap}.orange-btn{background:linear-gradient(#ffcd6e,#ed8a39);border-color:#fff3b2;border-bottom-color:#bd672f}.red-btn{background:linear-gradient(#ff9c8d,#e86652);border-color:#ffe9d1;border-bottom-color:#bb5442}.muted-btn{background:linear-gradient(#d9ccad,#b7a27e);border-color:#fff3d4;border-bottom-color:#918066}.green-btn:disabled,.orange-btn:disabled{filter:grayscale(.72);opacity:.65;cursor:default}.stack{display:flex;flex-direction:column;gap:10px}.list-card{display:flex;align-items:center;gap:12px;border-radius:20px;background:#fff9ec;border:2px solid white;border-bottom:4px solid #dec19b;padding:12px}.list-icon{width:51px;height:51px;display:grid;place-items:center;background:#fff0ce;border-radius:15px;font-size:30px;flex-shrink:0}.list-body{flex:1;min-width:0}.list-title{font-weight:1000;font-size:14px}.list-desc{font-size:11px;color:#a07b59;margin-top:5px;line-height:1.5}.section-title{font-size:15px;font-weight:1000;margin:12px 1px 9px}.inv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.inv-cell{border-radius:17px;background:#fffaf0;border:2px solid white;border-bottom:4px solid #e9cba2;padding:8px;text-align:center}.inv-cell .i{font-size:27px}.inv-cell .n{font-weight:900;font-size:11px}.inv-cell .v{font-weight:1000;font-size:14px;color:#44964d}.progress{height:12px;border-radius:14px;background:#e3cb9e;border:2px solid #fff1d6;overflow:hidden;margin:8px 0}.progress span{display:block;height:100%;border-radius:12px;background:linear-gradient(90deg,#a6e76e,#4bad53);transition:width .3s}.big-action{width:100%;font-size:15px;padding:13px}.empty{font-size:12px;color:#9b744d;text-align:center;padding:20px 8px}.field-note{background:#fff5d8;border:1px dashed #d5ad71;border-radius:15px;padding:10px;margin:10px 0;font-size:12px;line-height:1.7}.order-line{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:8px 0;font-size:13px}.order-line .need{background:#f4e5cb;border-radius:14px;padding:5px 8px;font-weight:900}.order-line .ok{background:#dff1c5;color:#39854b}.craft-done{color:#3c9f49;font-size:12px;font-weight:900}.mode-sign{position:absolute;top:calc(env(safe-area-inset-top) + 152px);left:50%;transform:translateX(-50%);background:#fff5d7f2;border:2px solid white;border-bottom:4px solid #d4a65f;border-radius:19px;padding:10px 13px;text-align:center;font-weight:900;font-size:13px;display:none;z-index:8;max-width:90vw}.mode-sign button{background:#ffdfcf;border-radius:9px;padding:4px 8px;margin-right:9px;color:#a95344;font-weight:900}
@media(min-width:800px){.logo-title{font-size:36px}.topbar{left:24px;right:24px}.dock{height:95px}.dock button{font-size:12px}.dock .ico{font-size:31px}.float-btn{width:59px;height:59px}.hint{font-size:13px}}@media(max-width:375px){.topbar{gap:3px;left:7px;right:7px}.profile{min-width:122px;padding:4px 6px;gap:5px}.avatar{width:33px;height:33px;font-size:20px}.money-pill{font-size:11px;padding:6px}.money-pill span{font-size:15px}.money-pill.gems .plus{display:none}.logo-title{font-size:24px}.dock{gap:1px;padding:5px}.dock button{font-size:9px}.dock .ico{font-size:25px}.hint{font-size:10px}}

<body>
<canvas id="game" aria-label="المزرعة التفاعلية"></canvas>
<div id="ui">
  <header class="topbar"><div class="profile"><div class="avatar">👨🏻‍🌾</div><div style="flex:1"><div class="profile-name">مزرعتي السعيدة</div><div class="level-line" id="levelText">المستوى 2</div><div class="level-track"><div class="level-fill" id="levelFill"></div></div></div></div><div class="wallet"><div class="money-pill"><span>🪙</span><b id="coinText">650</b><div class="plus">+</div></div><div class="money-pill gems"><span>💎</span><b id="gemText">20</b></div></div></header>
  <div class="logo"><div class="logo-title">☀️ مزرعة الشمس</div><div class="logo-sub">SUNNY FARM VALLEY</div></div>
  <button class="weather" id="weatherBtn" title="الطقس">☀️ مشمس <small>٢٤°</small></button>
  <div class="floating-tools"><button class="float-btn" id="questBtn" title="المهام">📜<b id="questBadge">3</b></button><button class="float-btn" id="expandBtn" title="توسعة المزرعة">🗺️</button><button class="float-btn" id="decorBtn" title="ديكور المزرعة">🌻</button></div>
  <div class="zoom-controls"><button id="zoomIn" aria-label="تكبير">+</button><button id="zoomOut" aria-label="تصغير">−</button></div>
  <div class="hint" id="hint">🌾 اضغط على التراب لزراعة محصول، واسحب لتحريك المزرعة</div>
  <div class="mode-sign" id="modeSign"></div>
  <nav class="dock"><button id="plantsBtn"><span class="ico">🌱</span>الزراعة</button><button id="animalsBtn"><span class="ico">🐮</span>الحيوانات</button><button id="factoriesBtn"><span class="ico">🏭</span>المصانع</button><button id="ordersBtn"><span class="ico">🚚</span>الطلبات</button><button id="shopBtn"><span class="ico">🛒</span>السوق</button></nav>
  <div id="toast" class="toast"></div>
  <div id="sheetBackdrop"><section id="sheet" role="dialog" aria-modal="true" aria-label="قائمة اللعبة"></section></div>
</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), canvas=$('game'), ctx=canvas.getContext('2d',{alpha:false});
const W=106,H=54,MAP=16, SAVE_KEY='sunny_farm_valley_v3';let sw=0,sh=0,dpr=1,zoom=1,panX=0,panY=0,tick=0,frame=0;
const CROPS={wheat:{name:'قمح ذهبي',icon:'🌾',color:'#f5ca51',time:13000,cost:2,yield:4,xp:5,level:1,sell:5},corn:{name:'ذرة حلوة',icon:'🌽',color:'#e6d854',time:26000,cost:3,yield:4,xp:8,level:2,sell:7},carrot:{name:'جزر طازج',icon:'🥕',color:'#f28b3e',time:38000,cost:4,yield:4,xp:11,level:3,sell:9},sugar:{name:'قصب السكر',icon:'🎋',color:'#8cde69',time:58000,cost:6,yield:4,xp:15,level:4,sell:12},strawberry:{name:'فراولة',icon:'🍓',color:'#f65c62',time:75000,cost:8,yield:3,xp:19,level:5,sell:18},pumpkin:{name:'يقطين',icon:'🎃',color:'#f9ab3b',time:100000,cost:11,yield:3,xp:25,level:6,sell:25}};
const GOODS={...CROPS,egg:{name:'بيض طازج',icon:'🥚',sell:16},milk:{name:'حليب',icon:'🥛',sell:22},bread:{name:'خبز طازج',icon:'🍞',sell:35},cheese:{name:'جبن',icon:'🧀',sell:52},feed:{name:'علف',icon:'🌿',sell:15},syrup:{name:'شراب السكر',icon:'🍯',sell:70},jam:{name:'مربى',icon:'🫙',sell:92}};
const FAC={bakery:{name:'المخبز الدافئ',icon:'🥐',lvl:1,recipes:[{item:'bread',ingredients:{wheat:3},ms:24000,xp:16}]},mill:{name:'مطحنة العلف',icon:'🌾',lvl:1,recipes:[{item:'feed',qty:3,ingredients:{wheat:2,corn:1},ms:19000,xp:12}]},dairy:{name:'معمل الألبان',icon:'🧀',lvl:3,recipes:[{item:'cheese',ingredients:{milk:2,corn:1},ms:47000,xp:26}]},sugarmill:{name:'معمل الحلويات',icon:'🍯',lvl:4,recipes:[{item:'syrup',ingredients:{sugar:3},ms:55000,xp:35},{item:'jam',ingredients:{strawberry:3,sugar:1},ms:80000,xp:45,level:5}]}};
const STATIC=[
 {x:3,y:2,type:'house',name:'بيت المزرعة',span:2},
 {x:8,y:2,type:'barn',name:'الحظيرة الكبيرة',span:2},
 {x:2,y:8,type:'chicken',name:'حظيرة الدجاج',span:2},
 {x:10,y:7,type:'cow',name:'مرعى الأبقار',span:2},
 {x:6,y:10,type:'bakery',name:'المخبز',span:2},
 {x:11,y:10,type:'dairy',name:'معمل الألبان',span:2},
 {x:2,y:12,type:'mill',name:'مطحنة العلف',span:2},
 {x:13,y:4,type:'sugarmill',name:'معمل الحلويات',span:2},
 {x:12,y:1,type:'pond',name:'بركة البط'},
 {x:1,y:4,type:'orchard',name:'بستان الأشجار'},
 {x:7,y:14,type:'market',name:'بسطة السوق'},
 {x:12,y:13,type:'truck',name:'لوحة الطلبات'}
];
const PLOT_POS=[[5,4],[6,4],[7,4],[5,5],[6,5],[7,5],[5,6],[6,6],[7,6],[4,4],[4,5],[4,6],[8,5],[8,6],[6,7],[7,7],[8,7],[5,7],[9,5],[10,4],[4,7],[3,6],[3,5],[6,8]];
function fresh(){return {coins:650,gems:20,level:2,xp:4,inventory:{wheat:8,corn:5,egg:2,feed:3,milk:0},plots:PLOT_POS.slice(0,9).map(([x,y],i)=>({x,y,crop:[1,2,6].includes(i)?'wheat':i===4?'corn':null,at:i===1?Date.now()-16000:i===2?Date.now()-7000:i===4?Date.now()-13000:i===6?Date.now()-3500:0})),animals:{chicken:{ready:true,end:0},cow:{ready:false,end:0}},factories:{bakery:null,mill:null,dairy:null,sugarmill:null},orders:[],stats:{harvest:0,eggs:0,orders:0},questsClaimed:{},decors:[],land:0,music:false,weather:false};}
let s=fresh();try{let d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(d&&typeof d.coins==='number'&&d.plots&&d.inventory){s={...fresh(),...d,animals:{...fresh().animals,...d.animals},factories:{...fresh().factories,...d.factories},stats:{...fresh().stats,...d.stats},questsClaimed:d.questsClaimed||{},decors:d.decors||[]};}}catch(e){}
const questDefs=[{key:'harvest',name:'موسم حصاد سعيد',desc:'احصد ٨ مرات من حقولك',icon:'🌾',target:8,reward:115,xp:22},{key:'eggs',name:'فطور أهل القرية',desc:'اجمع ٤ بيضات من الدجاج',icon:'🥚',target:4,reward:135,xp:24},{key:'orders',name:'تاجر القرية',desc:'سلّم طلبين للشاحنة',icon:'🚚',target:2,reward:170,xp:30}];
const rnd=(a,b)=>{let n=Math.sin(a*127.1+b*311.7)*43758.5453;return n-Math.floor(n);};
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(s));}catch(e){}};
function lvlGoal(l){return 26+l*23;}function inv(item){return s.inventory[item]||0;}function add(item,n){s.inventory[item]=Math.max(0,inv(item)+n);}function money(n){s.coins=Math.max(0,s.coins+n);updateHUD();}
function grantXP(n){s.xp+=n;let gained=0;while(s.xp>=lvlGoal(s.level)){s.xp-=lvlGoal(s.level);s.level++;s.coins+=70+s.level*20;gained++;}if(gained){toast('🎉 وصلت للمستوى '+s.level+'! فتحنا لك أشياء جديدة');bursts(sw*.5,sh*.33,'#ffd350',35);}updateHUD();save();}
function updateHUD(){$('coinText').textContent=s.coins.toLocaleString('ar-SA');$('gemText').textContent=s.gems;$('levelText').textContent='المستوى '+s.level;$('levelFill').style.width=Math.min(100,100*s.xp/lvlGoal(s.level))+'%';$('questBadge').textContent=questDefs.filter(q=>!s.questsClaimed[q.key]).length;}
function spawnOrder(i){const allowed=['wheat','corn','egg','bread','feed',...(s.level>=3?['carrot','milk']:[]),...(s.level>=4?['sugar','cheese']:[]),...(s.level>=5?['strawberry']:[])];const j=Math.floor(rnd(Date.now()%999999+i*31,i+3)*allowed.length);const item=allowed[j];let q=(item==='wheat'||item==='corn'?4+Math.floor(rnd(i,Date.now()%300)*3):item==='egg'?2: item==='feed'?2:1);return {id:Date.now()+i*33,item,qty:q,coins:Math.round(q*(GOODS[item].sell||10)*1.85+20),xp:12+q*4};}
if(!s.orders?.length){s.orders=[{id:1,item:'wheat',qty:5,coins:63,xp:14},{id:2,item:'egg',qty:2,coins:86,xp:18},{id:3,item:'corn',qty:4,coins:75,xp:17}];}
let pointer=null,moving=false,activeSheet='',selectedPlot=null,placeMode=null,toastTimer=null,particles=[],floatings=[],truckAnim=0,weatherShift=0,weatherOn=false;
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function hints(txt){$('hint').textContent=txt;$('hint').style.opacity='1';}
function showMode(txt){const el=$('modeSign');el.style.display='block';el.innerHTML='<span>'+txt+'</span><button id="stopMode">إلغاء ✕</button>';$('stopMode').onclick=()=>{placeMode=null;el.style.display='none'}}
function closeMode(){placeMode=null;$('modeSign').style.display='none'}
function openSheet(title,desc,body){activeSheet=title;$('sheet').innerHTML=`<div class="sheet-head"><div><h2>${title}</h2>${desc?`<p class="sub">${desc}</p>`:''}</div><button class="close-btn" id="sheetClose" aria-label="إغلاق">×</button></div>${body}`;$('sheetBackdrop').classList.add('open');$('sheetClose').onclick=closeSheet;}
function closeSheet(){$('sheetBackdrop').classList.remove('open');activeSheet=''}
$('sheetBackdrop').addEventListener('pointerdown',e=>{if(e.target===$('sheetBackdrop'))closeSheet()});

function shade(hex,diff){let v=hex.replace('#','');let rgb=[0,2,4].map(i=>Math.min(255,Math.max(0,parseInt(v.slice(i,i+2),16)+diff)));return '#'+rgb.map(i=>i.toString(16).padStart(2,'0')).join('')}
function gradient(x,y,r,c1,c2){let g=ctx.createRadialGradient(x-r*.25,y-r*.32,2,x,y,r);g.addColorStop(0,c1);g.addColorStop(1,c2);return g}

function decorDraw(o){switch(o.type){case 'tree':tree(0,0,1.1,true);break;case 'flower':for(let i=0;i<10;i++)flower((rnd(i,2)-.5)*56,(rnd(i,3)-.5)*20,1.1,['#ffb0cb','#ffdc73','#e9b3ff'][i%3]);bush(0,0,.55,true);break;case 'fountain':drop(31,11);oval(0,-1,32,16,'#e4d4b7','#9a8874',2);oval(0,-3,27,12,'#8ad7df');roundRect(-6,-34,12,28,3,'#f7e2bf','#b59c7a',2);oval(0,-34,10,4,'#8ccfdb');for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(0,-40);ctx.quadraticCurveTo(i*20,-42,i*20,-5);ctx.strokeStyle='#b0f7f4';ctx.lineWidth=2;ctx.stroke()}break;case 'hay':for(let i=0;i<3;i++){ctx.save();ctx.translate(i*21-25,i%2*9);roundRect(-13,-22,29,20,7,'#f9d668','#c99440',2);for(let k=0;k<4;k++)line(-8+k*5,-18,-8+k*5,-3,'#ebae48',1);ctx.restore()}break;case 'bench':roundRect(-31,-23,63,9,3,'#b98252','#784a2f',2);roundRect(-31,-12,63,10,3,'#d2a16a','#784a2f',2);line(-22,-1,-22,11,'#875a40',4);line(22,-1,22,11,'#875a40',4);break;case 'windmill':drop(36,13);poly([[-13,-3],[-9,-81],[5,-101],[17,-2]],'#e0bf8d','#a08056',2);poly([[-20,-83],[3,-115],[24,-83]],'#f2ddaa','#9a7556',2);for(let i=0;i<4;i++){let a=i*Math.PI/2+tick*.8,px=Math.cos(a)*36,py=Math.sin(a)*36;line(0,-75,px,-75+py,'#ead0a6',9);line(0,-75,px,-75+py,'#987951',1.5)}oval(0,-75,5,5,'#9e704a');break;}}
function details(){// gently moving world ambiance, dust, hills and wildflower border
let cx=sw*.5,cy=sh*.5;ctx.fillStyle='#79bd66';ctx.fillRect(0,0,sw,sh);let g=ctx.createLinearGradient(0,0,0,sh);g.addColorStop(0,'#a6e7b0');g.addColorStop(.45,'#92d47b');g.addColorStop(1,'#6db55c');ctx.fillStyle=g;ctx.fillRect(0,0,sw,sh);

function tileGround(){const order=[];for(let x=0;x<MAP;x++)for(let y=0;y<MAP;y++)order.push({x,y,sort:x+y});order.sort((a,b)=>a.sort-b.sort||a.x-b.x);

for(let x=0;x<MAP;x++)for(let y=0;y<MAP;y++){let r=rnd(x+44,y+9);if((x<2||x>13||y<2||y>13)&&r>.59){decorations.push({x,y,type:r>.88?'tree':'bush',seed:r})}}
}
let decorations=[];

// base board has gentle thick dirt diamond border

let items=[];for(let x=0;x<MAP;x++)for(let y=0;y<MAP;y++){let [px,py]=proj(x,y);items.push({k:'tile',x,y,px,py,z:x+y})}items.sort((a,b)=>a.z-b.z||a.x-b.x);for(let o of items){ctx.save();ctx.translate(o.px,o.py);tile(o.x,o.y);ctx.restore()}
const actors=[];for(let p of s.plots)actors.push({x:p.x,y:p.y,t:'plot',data:p});for(let o of STATIC)actors.push({x:o.x,y:o.y,t:o.type,data:o});for(let o of s.decors)actors.push({x:o.x,y:o.y,t:'decor',data:o});for(let x=0;x<MAP;x++)for(let y=0;y<MAP;y++){let r=rnd(x+44,y+9);if((x<2||x>13||y<2||y>13)&&r>.57&&!canOccupyForScenery(x,y))actors.push({x,y,t:r>.86?'tree':'bush',seed:r});}
// intentional little living props
actors.push({x:4.7+Math.sin(tick*.2)*.35,y:7.8+Math.sin(tick*.27)*.3,t:'farmer',seed:1},{x:10,y:1,t:'tree',seed:3},{x:1,y:11,t:'tree',seed:4},{x:14,y:9,t:'tree',seed:5},{x:1,y:1,t:'tree',seed:6},{x:9,y:12,t:'bush',seed:7},{x:12,y:5,t:'bush',seed:8},{x:4,y:12,t:'bush',seed:9});
actors.sort((a,b)=>(a.x+a.y)-(b.x+b.y)||a.x-b.x);
for(let o of actors){let [xx,yy]=proj(o.x,o.y);ctx.save();ctx.translate(xx,yy);if(o.t==='plot')plotArt(o.data);else if(o.t==='house')house();else if(o.t==='barn')barn();else if(o.t==='chicken')coop();else if(o.t==='cow')cowBarn();else if(o.t==='bakery')bakery();else if(o.t==='dairy')dairy();else if(o.t==='mill')mill();else if(o.t==='sugarmill')sugarMill();else if(o.t==='pond')pond();else if(o.t==='orchard')orchard();else if(o.t==='market')marketStall();else if(o.t==='truck')truck();else if(o.t==='decor')decorDraw(o.data);else if(o.t==='farmer')farmer();else if(o.t==='tree')tree(0,0,(.65+o.seed*.35),o.seed>.8);else if(o.t==='bush')bush(0,0,.5+o.seed*.4,o.seed>.7);
if(['dairy','sugarmill'].includes(o.t)&&s.level<FAC[o.t].lvl){oval(0,-92,17,17,'#f7dc9e','#bb8756',2);txt('🔒',0,-93,17,'white',null,0)}
if(['bakery','dairy','mill','sugarmill'].includes(o.t)&&s.factories[o.t]){let t=s.factories[o.t];if(Date.now()>=t.end){oval(0,-122+Math.sin(tick*3)*3,14,14,'#fff9d4','#e8b15a',2);txt('✓',0,-124+Math.sin(tick*3)*3,14,'#55b35b',null,0)}else{for(let i=0;i<3;i++){let a=(tick*.65+i*.9)%2.7;oval(32+Math.sin(i+a)*6,-100-a*19,5+a*2,3+a,'#fffbe6'+(a<1?'b6':'59'))}}}
ctx.restore();}
const bugs=[[4.5,3.5],[10.8,5.2],[9.3,12.3],[2.4,4.1]];for(let i=0;i<bugs.length;i++){let p=bugs[i],px=proj(p[0]+Math.sin(tick*.33+i)*.4,p[1]+Math.cos(tick*.37+i)*.35);ctx.save();ctx.translate(px[0],px[1]-45);butterfly(0,0,.85);ctx.restore()}ctx.restore();}
function canOccupyForScenery(x,y){return s.plots.some(p=>p.x===x&&p.y===y)||s.decors.some(p=>p.x===x&&p.y===y)||STATIC.some(p=>Math.abs(p.x-x)<(p.span||1)+.2&&Math.abs(p.y-y)<(p.span||1)+.2)}
function rain(){ctx.save();ctx.strokeStyle='#ddfaff9c';ctx.lineWidth=1.4;for(let i=0;i<110;i++){let x=(rnd(i,111)*sw+tick*80)%sw,y=(rnd(i,919)*sh+tick*580)%sh;line(x,y,x-6,y+16,'#e8ffffaa',1.4)}ctx.restore()}
function shadeScene(){let day=(Math.sin(Date.now()/1000/75)+1)/2;let amt=Math.max(0,.25-day*.39);if(amt>.04){ctx.fillStyle=`rgba(30,55,105,${Math.min(.27,amt)})`;ctx.fillRect(0,0,sw,sh)}for(let i=0;i<11;i++){let x=rnd(i,33)*sw,y=rnd(i,77)*sh;let v=(Math.sin(tick*2+i)+1)/2;oval(x,y,1+2*v,1+2*v,'rgba(255,250,170,'+(v*.15)+')')}}
function bursts(x,y,col='#ffee81',n=10){for(let i=0;i<n;i++){let a=Math.PI*2*i/n,sp=40+Math.random()*95;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-45,life:1,c:col,s:3+Math.random()*5})}}
function floatText(x,y,t){let [xx,yy]=posOf(x,y);floatings.push({x:xx,y:yy,txt:t,life:1})}
function renderParticles(dt){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=135*dt;p.life-=dt*1.4;if(p.life<=0){particles.splice(i,1);continue}ctx.globalAlpha=p.life;ctx.save();ctx.translate(p.x,p.y);ctx.rotate((1-p.life)*3);roundRect(-p.s/2,-p.s/2,p.s,p.s,2,p.c);ctx.restore()}ctx.globalAlpha=1;for(let i=floatings.length-1;i>=0;i--){let p=floatings[i];p.y-=22*dt;p.life-=dt*.72;if(p.life<=0){floatings.splice(i,1);continue}ctx.globalAlpha=p.life;txt(p.txt,p.x,p.y,17,'#fffddc','#5b8f3d',3)}ctx.globalAlpha=1;}
let lastT=performance.now();function animate(t){let dt=Math.min(.06,(t-lastT)/1000);lastT=t;tick+=dt;frame++;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,sw,sh);details();renderWorld();shadeScene();if(weatherOn)rain();renderParticles(dt);if(frame%45===0){for(let a of Object.values(s.animals))if(a.end&&a.end<=Date.now()){a.ready=true;a.end=0;save()}}requestAnimationFrame(animate)}
function handleTap(sx,sy){let c=cellAt(sx,sy),x=c.x,y=c.y;if(x<0||x>=MAP||y<0||y>=MAP)return; if(placeMode){putDecor(x,y);return;}let p=s.plots.find(p=>p.x===x&&p.y===y);if(p){if(!p.crop)pickSeed(p);else harvest(p);return}
let candidates=STATIC.filter(o=>Math.abs(o.x-x)<(o.span||1)&&Math.abs(o.y-y)<(o.span||1));let o=candidates.sort((a,b)=>Math.abs(a.x-x)+Math.abs(a.y-y)-Math.abs(b.x-x)-Math.abs(b.y-y))[0];if(o){switch(o.type){case'chicken':animalSheet('chicken');return;case'cow':animalSheet('cow');return;case'bakery':case'mill':case'dairy':case'sugarmill':factorySheet(o.type);return;case'truck':ordersSheet();return;case'market':marketSheet();return;case'house':questSheet();return;case'barn':plantsSheet();return;case'pond':toast('🦆 أجواء هادئة عند بركة البط');return;case'orchard':toast('🍎 قريبًا: أشجار الفاكهة المثمرة');return}}
let deco=s.decors.find(o=>o.x===x&&o.y===y);if(deco){toast('🌻 زينة جميلة!');return}
if(s.plots.length<PLOT_POS.length&&PLOT_POS.slice(s.plots.length).some(p=>p[0]===x&&p[1]===y)){toast('🌱 اضغط على السوق لتشتري حقلًا هنا!');return}
}
const pointers=new Map();let tapStart=null;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){tapStart={x:e.clientX,y:e.clientY,time:Date.now()};moving=false}else tapStart=null});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){let dx=e.clientX-prev.x,dy=e.clientY-prev.y;panX+=dx;panY+=dy;if(tapStart&&Math.hypot(tapStart.x-e.clientX,tapStart.y-e.clientY)>8)moving=true;}else if(pointers.size===2){let arr=[...pointers.values()],ids=[...pointers.keys()];let other=arr[ids.indexOf(e.pointerId)===0?1:0];let prevDist=Math.hypot(prev.x-other.x,prev.y-other.y);let nextDist=Math.hypot(e.clientX-other.x,e.clientY-other.y);if(prevDist>4)zoom=Math.max(.52,Math.min(1.65,zoom*nextDist/prevDist));moving=true;}panX=Math.max(-950,Math.min(950,panX));panY=Math.max(-720,Math.min(720,panY));});canvas.addEventListener('pointerup',e=>{if(!moving&&tapStart&&pointers.size===1&&Date.now()-tapStart.time<700)handleTap(e.clientX,e.clientY);pointers.delete(e.pointerId);tapStart=null});canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);tapStart=null});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.52,Math.min(1.65,zoom+(e.deltaY>0?-.07:.07)))},{passive:false});
weatherOn=s.weather;updateHUD();setTimeout(()=>hints('👆 اضغط على الحقول البنية للزراعة • اسحب لتتجول • قرّب بإصبعين'),3000);requestAnimationFrame(animate);setInterval(save,15000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
